site_name: INFINITAS打鍵カウンタ 説明書
site_description: INFINITAS打鍵カウンタの使い方と更新情報
site_url: https://dj-kata.github.io/inf_daken_counter_obsw/
repo_url: https://github.com/dj-kata/inf_daken_counter_obsw
repo_name: dj-kata/inf_daken_counter_obsw
edit_uri: edit/master/docs/
docs_dir: docs
site_dir: site
exclude_docs: |
  README.md
theme:
  name: material
  language: ja
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
plugins:
  - search:
      lang: ja
markdown_extensions:
  - admonition
  - attr_list
  - fenced_code
  - pymdownx.magiclink
  - tables
  - toc:
      permalink: true
nav:
  - はじめに: index.md
  - 打鍵カウンタの導入方法:
      - 通常の手順: install.md
      - v2から移行する場合: migration-v2.md
  - OBS向けHTMLビューの利用方法: obs-views.md
  - その他の機能:
      - スコアビューワ: score-viewer.md
      - HTTPサーバ（スマホ連携）: mobile.md
      - ライバル登録: rivals.md
      - OBS自動制御: obs-control.md
      - リザルト画像の保存: image-save.md
      - その他の機能: features.md
  - 更新情報: releases.md
