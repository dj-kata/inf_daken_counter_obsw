<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>INFINITAS Scores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=RocknRoll+One&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #101214;
      --panel: #181d22;
      --panel2: #222830;
      --text: #f4f6f8;
      --muted: #9ca7af;
      --line: #323943;
      --green: #55d68b;
      --blue: #79b8ff;
      --red: #ff7676;
      --amber: #ffd166;
      --bpi: #b58cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    button, input { font: inherit; }
    .app { min-height: 100dvh; display: grid; grid-template-rows: auto auto minmax(0, 1fr); }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(16, 18, 20, 0.95);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
      padding: max(12px, env(safe-area-inset-top)) 14px 12px;
    }
    .top {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr) 92px;
      align-items: center;
      gap: 8px;
    }
    .nav-left { display: flex; gap: 8px; }
    .nav-right { display: flex; gap: 8px; justify-content: flex-end; }
    .icon-btn {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font-size: 22px;
    }
    .icon-btn:disabled { opacity: 0.35; }
    h1 {
      margin: 0;
      min-width: 0;
      font-size: 18px;
      line-height: 1.2;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: #13171b;
    }
    .stat {
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    .stat span { display: block; color: var(--muted); font-size: 11px; }
    .stat strong {
      display: block;
      margin-top: 2px;
      font-size: 16px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    main { min-height: 0; overflow-y: auto; padding: 12px 12px max(24px, env(safe-area-inset-bottom)); }
    .grid { display: grid; gap: 8px; }
    .folders { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .folder {
      min-height: 78px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      padding: 12px;
      text-align: left;
    }
    .folder.primary { border-color: color-mix(in srgb, var(--green), var(--line) 52%); }
    .folder.history { border-color: color-mix(in srgb, var(--red), var(--line) 58%); }
    .folder.current { border-color: color-mix(in srgb, var(--amber), var(--line) 52%); }
    .folder b { display: block; font-size: 16px; line-height: 1.2; }
    .folder span { display: block; margin-top: 8px; color: var(--muted); font-size: 12px; }
    .toolbar { margin-bottom: 10px; }
    .mode-tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }
    .mode-tabs label {
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .mode-tabs input { accent-color: var(--green); }
    .mode-tabs label:has(input:checked) {
      color: var(--text);
      border-color: color-mix(in srgb, var(--green), var(--line) 45%);
      background: var(--panel2);
    }
    .sort-tabs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 10px;
    }
    .sort-tabs label {
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .sort-tabs input { accent-color: var(--green); }
    .sort-tabs label:has(input:checked) {
      color: var(--text);
      border-color: color-mix(in srgb, var(--green), var(--line) 45%);
      background: var(--panel2);
    }
    .search {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      padding: 0 12px;
    }
    .song-list, .plain-list { display: grid; gap: 8px; }
    .song-cell, .plain-row {
      width: 100%;
      min-height: 74px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: inherit;
      text-align: left;
      padding: 10px;
    }
    .song-cell.level-cell {
      grid-template-columns: 12px minmax(0, 1fr) auto;
      min-height: 42px;
      gap: 8px;
      padding: 0 10px 0 0;
      overflow: hidden;
    }
    .song-cell.level-cell.has-image {
      grid-template-columns: 12px minmax(0, 1fr) auto 26px;
      gap: 8px;
    }
    .level-lamp-bar {
      align-self: stretch;
      width: 12px;
      min-height: 42px;
      border-right: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
    }
    .level-image-link {
      align-self: center;
      width: 26px;
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-left: 1px solid rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      background: color-mix(in srgb, var(--blue), var(--panel) 78%);
      color: var(--text);
      font-size: 10px;
      font-weight: 950;
      writing-mode: vertical-rl;
      letter-spacing: 0;
    }
    .song-cell.level-cell > div {
      padding: 6px 0;
    }
    .level-cell .unofficial-lv {
      font-size: 12px;
      line-height: 1.1;
    }
    .level-main .title {
      line-height: 1.15;
    }
    .level-main .meta {
      margin-top: 3px;
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
      white-space: nowrap;
    }
    .level-info {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .level-marker {
      color: var(--blue);
      font-weight: 900;
    }
    .level-marker.katate {
      color: var(--amber);
    }
    .dp-unofficial {
      color: #c8d4ff;
      font-weight: 900;
      white-space: nowrap;
    }
    .level-score {
      min-width: 78px;
      display: grid;
      gap: 2px;
      justify-items: end;
      align-self: center;
      padding: 0;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .level-score .rankdiff {
      color: var(--text);
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
    }
    .rank-diff {
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .rank-diff-tail {
      color: var(--muted);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }
    .rank-MAX {
      animation: flashmax 0.4s infinite;
      font-weight: 950;
    }
    @keyframes flashmax {
      0% { color: #ff2828; }
      20% { color: #d5ff28; }
      40% { color: #28ff7e; }
      60% { color: #2872ff; }
      80% { color: #d528ff; }
      100% { color: #ff2828; }
    }
    .rank-AAA { color: #ffff28; }
    .rank-AA { color: #c3c3c3; }
    .rank-A { color: #2ddf71; }
    .rank-B, .rank-C, .rank-D, .rank-E, .rank-F { color: #7777ff; }
    .level-score .rate {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }
    .title { display: flex; gap: 6px; align-items: baseline; min-width: 0; white-space: nowrap; }
    .title-lv, .title-diff { flex: none; color: var(--blue); font-weight: 750; }
    .title-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: 800; }
    .meta { margin-top: 5px; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .score-block { text-align: right; min-width: 92px; display: grid; gap: 3px; justify-items: end; }
    .song-cell.level-cell.selectable {
      grid-template-columns: 30px 12px minmax(0, 1fr) auto;
      padding-left: 0;
      border-color: var(--line);
    }
    .song-cell.selectable.selected {
      border-color: color-mix(in srgb, var(--green), var(--line) 25%);
      background: color-mix(in srgb, var(--green), var(--panel) 88%);
    }
    .select-rail {
      align-self: stretch;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
    }
    .select-mark {
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: transparent;
      font-size: 12px;
      font-weight: 950;
    }
    .selected .select-mark {
      border-color: color-mix(in srgb, var(--green), #ffffff 16%);
      background: var(--green);
      color: #07120c;
    }
    .lamp-wrap { display: inline-flex; align-items: center; justify-content: flex-end; gap: 5px; }
    .lamp-box { display: inline-block; width: 24px; height: 16px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.18); }
    .lamp-name { color: var(--muted); font-size: 10px; font-weight: 800; line-height: 1; white-space: nowrap; }
    .fc { animation: flashfc 0.2s infinite; }
    @keyframes flashfc {
      0% { background-color: #ff2828; }
      20% { background-color: #d5ff28; }
      40% { background-color: #28ff7e; }
      60% { background-color: #2872ff; }
      80% { background-color: #d528ff; }
      100% { background-color: #ff2828; }
    }
    .failed { animation: flashfailed 0.08s infinite; }
    @keyframes flashfailed {
      0% { background-color: #ff2828; }
      50% { background-color: #282828; }
      100% { background-color: #ff2828; }
    }
    .ac { background-color: #ff66ff; }
    .ec { background-color: #22ff22; }
    .nc { background-color: #22ccff; }
    .hc { background-color: #ffffff; }
    .exh { animation: flashexh 0.08s infinite; }
    @keyframes flashexh {
      0% { background-color: #ff2828; }
      50% { background-color: #ffff28; }
      100% { background-color: #ff2828; }
    }
    .score { font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 850; }
    .subscore { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .bpi-chip {
      display: inline-block;
      font-size: 15px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      margin-top: 0;
      white-space: nowrap;
    }
    .row .bpi-chip { display: inline-block; font-size: 15px; margin-top: 0; }
    .bpi-chip.positive {
      color: #f4eeff;
      text-shadow: 0 0 8px rgba(181, 140, 255, 0.72);
    }
    .bpi-chip.negative {
      color: var(--muted);
      text-shadow: none;
    }
    .unofficial-lv {
      display: inline-flex;
      align-items: baseline;
      gap: 2px;
      flex: none;
      font-weight: 900;
      white-space: nowrap;
    }
    .unofficial-easy { color: #bbddff; }
    .unofficial-hard { color: #ffaaaa; }
    .unofficial-sep { color: var(--text); opacity: 0.88; }
    .lv-token {
      color: var(--blue);
      font-weight: 850;
      white-space: nowrap;
    }
    .empty, .error { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--muted); padding: 22px 14px; text-align: center; }
    .detail-head { margin-bottom: 12px; }
    .detail-title { font-size: 20px; font-weight: 850; line-height: 1.25; overflow-wrap: anywhere; }
    .pill-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .pill { min-height: 24px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel2); padding: 4px 8px; font-size: 12px; }
    .metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
    .metric { min-width: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 10px; }
    .metric span { display: block; color: var(--muted); font-size: 11px; }
    .metric strong { display: block; margin-top: 3px; font-size: 18px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .metric.featured { border-color: color-mix(in srgb, var(--amber), var(--line) 45%); }
    .metric.featured strong { color: var(--amber); font-size: 24px; }
    .metric.featured.bpi strong { color: var(--bpi); }
    .ereter-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: -4px 0 12px;
    }
    .ereter-box {
      position: relative;
      min-width: 0;
      border: 1px solid rgba(255, 220, 120, 0.45);
      border-radius: 8px;
      background: rgba(255, 220, 120, 0.10);
      padding: 8px 8px 7px;
      font-variant-numeric: tabular-nums;
    }
    .ereter-box.easy { border-color: rgba(150, 255, 110, 0.48); background: rgba(150, 255, 110, 0.12); }
    .ereter-box.hard { border-color: rgba(255, 80, 105, 0.52); background: rgba(255, 80, 105, 0.12); }
    .ereter-box.ereter-exh { border-color: rgba(255, 235, 70, 0.52); background: rgba(255, 235, 70, 0.12); }
    .ereter-box b { display: block; color: var(--muted); font-size: 10px; line-height: 1; text-transform: uppercase; }
    .ereter-box strong { display: block; margin-top: 4px; color: #ffffaa; font-size: 16px; font-weight: 950; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ereter-mark {
      position: absolute;
      top: -7px;
      right: 5px;
      font-size: 16px;
      line-height: 1;
      font-weight: 950;
      text-shadow: 0 1px 2px #000;
    }
    .ereter-mark.ok { color: #4cff7a; }
    .ereter-mark.ng { color: #ff5555; }
    .ereter-mini {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }
    .ereter-mini .ereter-box {
      min-width: 36px;
      padding: 3px 5px 2px;
      border-radius: 6px;
    }
    .ereter-mini .ereter-box b { font-size: 8px; }
    .ereter-mini .ereter-box strong { margin-top: 1px; font-size: 10px; }
    .ereter-mini .ereter-mark { top: -5px; right: 2px; font-size: 11px; }
    .arena-averages {
      display: grid;
      gap: 6px;
      margin: -4px 0 12px;
    }
    .arena-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 7px 9px;
      font-variant-numeric: tabular-nums;
    }
    .arena-rank {
      min-width: 34px;
      border-radius: 6px;
      padding: 2px 6px;
      color: #0f1115;
      font-size: 12px;
      font-weight: 950;
      text-align: center;
    }
    .arena-rank-a1 { background: #ffd54f; }
    .arena-rank-a2 { background: #64d8ff; }
    .arena-rank-a3 { background: #69f0ae; }
    .arena-rank-a4 { background: #ffb74d; }
    .arena-rank-a5 { background: #ff8a80; }
    .arena-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .arena-score {
      color: var(--text);
      font-size: 13px;
      font-weight: 900;
    }
    .arena-diff {
      min-width: 54px;
      text-align: right;
      font-size: 13px;
      font-weight: 900;
    }
    .arena-diff.positive { color: var(--green); }
    .arena-diff.negative { color: var(--red); }
    .receipt-arena { margin: 0 0 8px 0; padding-left: 10px; }
    .receipt-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 0 0 12px;
    }
    .summary-settings {
      margin: 0 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 10px;
    }
    .summary-settings[hidden] { display: none; }
    .summary-settings-title {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .summary-level-options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .summary-level-options label {
      min-height: 34px;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel2);
      padding: 6px 8px;
      color: var(--text);
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }
    .summary-level-options input { accent-color: var(--green); }
    .summary-settings details {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel2);
      overflow: hidden;
    }
    .summary-settings details + details { margin-top: 8px; }
    .summary-settings summary {
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      font-weight: 900;
      list-style: none;
    }
    .summary-settings summary::-webkit-details-marker { display: none; }
    .summary-settings summary::after { content: "⌄"; color: var(--muted); }
    .summary-settings details[open] summary::after { content: "⌃"; }
    .summary-settings-body { padding: 10px; border-top: 1px solid var(--line); }
    .period-options { display: grid; gap: 8px; }
    .period-options label {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      color: var(--text);
      font-size: 13px;
      font-weight: 850;
    }
    .period-options input[type="radio"] { accent-color: var(--green); }
    .custom-period {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .custom-period input {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      padding: 8px;
    }
    .image-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 30px;
      min-height: 28px;
      border: 1px solid color-mix(in srgb, var(--blue), var(--line) 40%);
      border-radius: 6px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 900;
      text-decoration: none;
    }
    .section { margin-top: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); overflow: hidden; }
    .section-title { display: flex; justify-content: space-between; gap: 10px; min-height: 36px; align-items: center; border-bottom: 1px solid var(--line); padding: 0 12px; font-size: 13px; font-weight: 850; text-transform: uppercase; }
    .section-title span { color: var(--muted); font-size: 11px; }
    details.section > summary.section-title { cursor: pointer; list-style: none; }
    details.section > summary.section-title::-webkit-details-marker { display: none; }
    details.section > summary.section-title::after { content: "⌃"; color: var(--muted); font-size: 13px; }
    details.section:not([open]) > summary.section-title { border-bottom: 0; }
    details.section:not([open]) > summary.section-title::after { content: "⌄"; }
    .section-body { padding: 0 10px 2px 10px; }
    .row { display: grid; grid-template-columns: 82px minmax(0, 1fr) auto; gap: 8px; align-items: center; border-bottom: 1px solid var(--line); padding: 10px 2px; }
    .row:last-child { border-bottom: 0; }
    .row b { display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    .row .unofficial-lv {
      display: inline-flex;
      color: inherit;
      font-size: inherit;
      margin-top: 0;
      white-space: nowrap;
    }
    .row .unofficial-lv span {
      display: inline;
      font-size: inherit;
      margin-top: 0;
      white-space: nowrap;
    }
    .row .dp-unofficial {
      display: inline;
      font-size: inherit;
      margin-top: 0;
      white-space: nowrap;
    }
    .row .lv-token {
      display: inline;
      font-size: inherit;
      margin-top: 0;
      white-space: nowrap;
    }
    .row .rank-diff,
    .row .rank-diff-tail {
      display: inline;
      margin-top: 0;
      white-space: nowrap;
    }
    .row .ereter-mini {
      display: inline-flex;
      margin-top: 4px;
      vertical-align: middle;
    }
    .row .ereter-mini .ereter-box,
    .row .ereter-mini .ereter-mark,
    .row .ereter-mini .ereter-box b,
    .row .ereter-mini .ereter-box strong {
      display: block;
      margin-top: 0;
    }
    .row .unofficial-easy,
    .pill .unofficial-easy,
    .title .unofficial-easy { color: #bbddff; }
    .row .unofficial-hard,
    .pill .unofficial-hard,
    .title .unofficial-hard { color: #ffaaaa; }
    .row .unofficial-sep,
    .pill .unofficial-sep,
    .title .unofficial-sep { color: var(--text); opacity: 0.88; }
    .row-score { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
    .row[data-chart] { cursor: pointer; }
    .delta { color: var(--green); font-weight: 850; }
    .bad-delta { color: var(--red); font-weight: 850; }
    .load-more { width: 100%; height: 44px; margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); color: var(--text); }
    .selection-action {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      padding: 10px 12px max(10px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: rgba(16, 18, 20, 0.94);
      backdrop-filter: blur(14px);
    }
    .selection-action[hidden] { display: none; }
    .selection-action button {
      width: 100%;
      min-height: 46px;
      border: 1px solid color-mix(in srgb, var(--green), var(--line) 35%);
      border-radius: 8px;
      background: #1b2b22;
      color: var(--text);
      font-size: 14px;
      font-weight: 900;
    }
    body.selection-mode main {
      padding-bottom: max(92px, calc(76px + env(safe-area-inset-bottom)));
    }
    .tweet-btn {
      width: 100%;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid color-mix(in srgb, var(--blue), var(--line) 35%);
      border-radius: 8px;
      background: #1b2530;
      color: var(--text);
      font-size: 14px;
      font-weight: 850;
      margin: 0;
    }
    .receipt-actions .secondary-btn { min-height: 42px; margin: 0; }
    .secondary-btn {
      width: 100%;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid color-mix(in srgb, var(--green), var(--line) 35%);
      border-radius: 8px;
      background: #17291f;
      color: var(--text);
      font-size: 14px;
      font-weight: 850;
    }
    @media (max-width: 420px) {
      .receipt-actions { grid-template-columns: 1fr; }
    }
    @media (min-width: 720px) {
      main { max-width: 920px; width: 100%; margin: 0 auto; }
      .folders { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .song-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="top">
        <div class="nav-left">
          <button id="homeBtn" class="icon-btn" aria-label="ホーム">&#8962;</button>
          <button id="backBtn" class="icon-btn" aria-label="戻る" disabled>&lsaquo;</button>
        </div>
        <h1 id="viewTitle">INFINITAS</h1>
        <div class="nav-right">
          <button id="settingsBtn" class="icon-btn" aria-label="設定">&#9881;</button>
          <button id="refreshBtn" class="icon-btn" aria-label="更新">&#8635;</button>
        </div>
      </div>
    </header>
    <section id="stats" class="stats"></section>
    <main id="content"></main>
  </div>

  <script>
    const state = { view: "home", stack: [], allItems: [], listVariant: "", levelSort: "title", levelSortEnabled: false, selectedImageIds: new Set(), savedImagesNotes: 0, historyOffset: 0, historyTotal: 0, currentTimer: null, receiptTimer: null, dailyMode: "daily", receiptData: null };
    const HISTORY_BASE = "inf-mobile-base";
    const HISTORY_APP = "inf-mobile-view";
    const $ = (id) => document.getElementById(id);
    const fmt = (v) => v == null || v === "" ? "-" : Number(v).toLocaleString("ja-JP");
    const pct = (v) => v == null ? "-" : `${(Number(v) * 100).toFixed(2)}%`;

    async function api(path) {
      const res = await fetch(path, { cache: "no-store" });
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      return await res.json();
    }
    function escapeText(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }
    function setTitle(text) {
      $("viewTitle").textContent = text;
      $("backBtn").disabled = state.stack.length === 0;
      $("homeBtn").disabled = state.view === "home";
      $("settingsBtn").disabled = state.view !== "receipt";
    }
    function setStats(items) {
      if (!items || items.length === 0) {
        $("stats").hidden = true;
        $("stats").innerHTML = "";
        return;
      }
      $("stats").hidden = false;
      $("stats").innerHTML = items.map(([label, value]) => `<div class="stat"><span>${escapeText(label)}</span><strong>${escapeText(value)}</strong></div>`).join("");
    }
    function push(view) { state.stack.push(view); }
    function currentHistoryState() { return { kind: HISTORY_APP, view: state.view, stack: [...state.stack] }; }
    function pushHistoryState() { window.history.pushState(currentHistoryState(), "", window.location.href); }
    function replaceHistoryState() { window.history.replaceState(currentHistoryState(), "", window.location.href); }
    function initBrowserBackControl() {
      window.history.replaceState({ kind: HISTORY_BASE }, "", window.location.href);
      window.history.pushState(currentHistoryState(), "", window.location.href);
    }
    function clearCurrentTimer() {
      if (state.currentTimer) clearInterval(state.currentTimer);
      state.currentTimer = null;
      if (state.receiptTimer) clearInterval(state.receiptTimer);
      state.receiptTimer = null;
    }
    function clearSelectionMode() {
      state.selectedImageIds.clear();
      document.body.classList.remove("selection-mode");
    }

    function renderHome(data) {
      clearSelectionMode();
      clearCurrentTimer();
      state.view = "home";
      setTitle("INFINITAS");
      setStats([["BEST", data.total_best_charts], ["PLAYS", data.total_results], ["NOTES", fmt(data.today_notes)]]);
      const special = data.special.map((f) => {
        const cls = f.id === "current" ? "current" : (f.id === "history" || f.id === "receipt" || f.id === "daily" ? "history" : "primary");
        return `<button class="folder ${cls}" data-folder="${f.id}"><b>${escapeText(f.label)}</b><span>${escapeText(f.count_label || `${f.count} items`)}</span></button>`;
      }).join("");
      const levels = data.levels.map((f) => `<button class="folder" data-folder="${f.id}"><b>${escapeText(f.label)}</b><span>${f.count} charts</span></button>`).join("");
      const dbx = (data.dbx || []).map((f) => `<button class="folder" data-folder="${f.id}"><b>${escapeText(f.label)}</b><span>${f.count} charts</span></button>`).join("");
      const katate = (data.katate || []).map((f) => `<button class="folder" data-folder="${f.id}"><b>${escapeText(f.label)}</b><span>${f.count} charts</span></button>`).join("");
      $("content").innerHTML = `<div class="grid folders">${special}${levels}${dbx}${katate}</div>`;
      document.querySelectorAll("[data-folder]").forEach((button) => button.addEventListener("click", () => openFolder(button.dataset.folder, true)));
    }

    function renderList(label, items, options = {}) {
      clearSelectionMode();
      state.allItems = items;
      state.listVariant = options.variant || "";
      state.levelSortEnabled = Boolean(options.sortControls);
      setTitle(label);
      setStats([["ITEMS", items.length], ["BEST", items.filter((i) => i.score || i.best_score).length], ["NOTES", fmt(options.notes || 0)]]);
      $("content").innerHTML = `${options.sortControls ? levelSortControls() : ""}<div class="toolbar"><input id="search" class="search" placeholder="Search" autocomplete="off"></div><div id="songList" class="song-list"></div>${options.loadMore ? '<button id="loadMore" class="load-more">MORE</button>' : ''}`;
      $("search").addEventListener("input", applyFilter);
      if (options.loadMore) $("loadMore").addEventListener("click", loadMoreHistory);
      document.querySelectorAll("[data-level-sort]").forEach((input) => input.addEventListener("change", () => {
        if (input.checked) {
          state.levelSort = input.value;
          applyFilter();
        }
      }));
      drawSongList(sortListItems(items));
    }
    function renderSavedImagesList(data) {
      state.allItems = data.items || [];
      state.listVariant = "saved-images";
      state.levelSortEnabled = false;
      state.savedImagesNotes = data.notes || 0;
      state.selectedImageIds.clear();
      document.body.classList.add("selection-mode");
      setTitle(data.folder.label);
      setStats([["IMAGES", state.allItems.length], ["SELECTED", 0], ["NOTES", fmt(data.notes || 0)]]);
      $("content").innerHTML = `<div class="toolbar"><input id="search" class="search" placeholder="Search" autocomplete="off"></div><div id="songList" class="song-list"></div><div id="selectionAction" class="selection-action" hidden><button id="combineImagesBtn" type="button">CREATE POST IMAGE</button></div>`;
      $("search").addEventListener("input", applySavedImagesFilter);
      $("combineImagesBtn").addEventListener("click", openCombinedResultImage);
      drawSavedImagesList(state.allItems);
    }
    function levelSortControls() {
      const options = [
        ["title", "title"],
        ["score_rate", "score rate"],
        ["bp", "bp"],
        ["lamp", "lamp"],
      ];
      return `<div class="sort-tabs">${options.map(([value, label]) => `<label><input type="radio" name="levelSort" data-level-sort value="${value}" ${state.levelSort === value ? "checked" : ""}>${label}</label>`).join("")}</div>`;
    }
    function applyFilter() {
      const q = $("search").value.trim().toLowerCase();
      const items = q ? state.allItems.filter((item) => String(item.title || "").toLowerCase().includes(q)) : state.allItems;
      drawSongList(sortListItems(items));
    }
    function sortListItems(items) {
      if (state.listVariant !== "level" || !state.levelSortEnabled) return items;
      const sorted = [...items];
      const numeric = (value, fallback) => {
        const n = Number(value);
        return Number.isFinite(n) ? n : fallback;
      };
      sorted.sort((a, b) => {
        if (state.levelSort === "score_rate") {
          return numeric(b.score_rate, -1) - numeric(a.score_rate, -1) || String(a.title || "").localeCompare(String(b.title || ""), "ja");
        }
        if (state.levelSort === "bp") {
          return numeric(a.bp ?? a.best_bp, Number.POSITIVE_INFINITY) - numeric(b.bp ?? b.best_bp, Number.POSITIVE_INFINITY) || String(a.title || "").localeCompare(String(b.title || ""), "ja");
        }
        if (state.levelSort === "lamp") {
          return numeric(b.lamp, -1) - numeric(a.lamp, -1) || String(a.title || "").localeCompare(String(b.title || ""), "ja");
        }
        return String(a.title || "").localeCompare(String(b.title || ""), "ja");
      });
      return sorted;
    }
    function drawSongList(items) {
      const node = $("songList");
      if (!items.length) {
        node.innerHTML = `<div class="empty">NO DATA</div>`;
        return;
      }
      node.innerHTML = items.map(songCell).join("");
      node.querySelectorAll("[data-chart]").forEach((button) => button.addEventListener("click", () => openChart(button.dataset.chart, true)));
      bindImageButtons(node);
    }
    function applySavedImagesFilter() {
      const q = $("search").value.trim().toLowerCase();
      const items = q ? state.allItems.filter((item) => String(item.title || "").toLowerCase().includes(q)) : state.allItems;
      drawSavedImagesList(items);
    }
    function drawSavedImagesList(items) {
      const node = $("songList");
      if (!items.length) {
        node.innerHTML = `<div class="empty">NO DATA</div>`;
        updateSelectionAction();
        return;
      }
      node.innerHTML = items.map(savedImageCell).join("");
      node.querySelectorAll("[data-image-id]").forEach((button) => button.addEventListener("click", () => {
        const imageId = button.dataset.imageId;
        if (state.selectedImageIds.has(imageId)) state.selectedImageIds.delete(imageId);
        else state.selectedImageIds.add(imageId);
        drawSavedImagesList(items);
      }));
      bindImageButtons(node);
      updateSelectionAction();
    }
    function savedImageCell(item) {
      const selected = state.selectedImageIds.has(String(item.image_id));
      const score = item.score ?? item.best_score;
      const bp = item.bp ?? item.best_bp;
      return `<button class="song-cell level-cell selectable ${selected ? "selected" : ""}" data-image-id="${escapeText(item.image_id || "")}">
        <span class="select-rail"><span class="select-mark">✓</span></span>
        ${leftRailHtml(item)}
        <div class="level-main">
          <div class="title"><span class="title-name">${escapeText(item.title)}</span><span class="title-diff">[${escapeText(item.difficulty || "")}]</span></div>
          <div class="meta">${levelSubInfoHtml(item, score, bp, { showLevelMarker: true })}</div>
        </div>
        <div class="level-score"><div class="rankdiff">${rankDiffHtml(item, "-")}</div><div class="rate">${pct(item.score_rate)}</div></div>
      </button>`;
    }
    function updateSelectionAction() {
      const count = state.selectedImageIds.size;
      const action = $("selectionAction");
      const button = $("combineImagesBtn");
      if (action) action.hidden = count === 0;
      if (button) button.textContent = `CREATE POST IMAGE (${count})`;
      if (state.listVariant === "saved-images") {
        setStats([["IMAGES", state.allItems.length], ["SELECTED", count], ["NOTES", fmt(state.savedImagesNotes || 0)]]);
      }
    }
    function openCombinedResultImage() {
      const ids = [...state.selectedImageIds];
      if (!ids.length) return;
      const query = ids.map(encodeURIComponent).join(",");
      window.open(`/api/combined-result-image?ids=${query}`, "_blank", "noopener");
    }
    function songCell(item) {
      const score = item.score ?? item.best_score;
      const bp = item.bp ?? item.best_bp;
      if (state.listVariant === "level" || state.listVariant === "compact") {
        return compactSongCell(item, score, bp, {
          showLevelMarker: state.listVariant === "compact" || isDpChart(item) || isDbxChart(item) || Boolean(item.enable_katate_difficulty_display && item.katate_band),
        });
      }
      return `<button class="song-cell" data-chart="${escapeText(item.chart_id || "")}">
        <div>
          <div class="title">${levelHtml(item)}<span class="title-name">${escapeText(item.title)}</span><span class="title-diff">[${escapeText(item.difficulty || "")}]</span></div>
          <div class="meta">${escapeText(item.date || item.last_played || "")}${item.opt ? " / " + escapeText(item.opt) : ""}${visibleBpiText(item) ? " / " + bpiHtml(visibleBpiText(item)) : ""}</div>
        </div>
        <div class="score-block">${imageOrLampHtml(item)}<div class="score">${fmt(score)}</div><div class="subscore">BP ${fmt(bp)}</div></div>
      </button>`;
    }
    function isDpChart(item) {
      const difficulty = String(item.difficulty || "").toUpperCase();
      return difficulty.startsWith("DP");
    }
    function isDbxChart(item) {
      return String(item.difficulty || "").toUpperCase().startsWith("DB");
    }
    function visibleBpiText(item) {
      return isDpChart(item) || isDbxChart(item) ? "" : (item.bpi || item.best_bpi || "");
    }
    function bpiHtml(value) {
      if (value == null || value === "") return "-";
      const numeric = Number(value);
      const cls = numeric > 0 ? "positive" : "negative";
      return `<span class="bpi-chip ${cls}">${escapeText(value)}</span>`;
    }
    function lampClass(lamp) {
      const value = Number(lamp) || 0;
      if (value === 1) return "failed";
      if (value === 2) return "ac";
      if (value === 3) return "ec";
      if (value === 4) return "nc";
      if (value === 5) return "hc";
      if (value === 6) return "exh";
      if (value === 7) return "fc";
      return "";
    }
    function lampHtml(lamp, text) {
      const cls = lampClass(lamp);
      const name = text || "";
      if (!cls) return `<span class="lamp-name">${escapeText(name)}</span>`;
      return `<span class="lamp-wrap"><span class="lamp-box ${cls}"></span><span class="lamp-name">${escapeText(name)}</span></span>`;
    }
    function imageOrLampHtml(item) {
      if (item.image_url) {
        return `<span class="image-link" data-image-url="${escapeText(item.image_url)}">IMG</span>`;
      }
      return lampHtml(item.lamp, item.lamp_text);
    }
    function bindImageButtons(root = document) {
      root.querySelectorAll("[data-image-url]").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          event.preventDefault();
          window.open(button.dataset.imageUrl, "_blank", "noopener");
        });
      });
    }
    function lampBarHtml(lamp) {
      const cls = lampClass(lamp);
      return `<span class="level-lamp-bar ${cls}"></span>`;
    }
    function leftRailHtml(item) {
      return lampBarHtml(item.lamp);
    }
    function imageRailHtml(item) {
      if (!item.image_url) return "";
      return `<span class="level-image-link" data-image-url="${escapeText(item.image_url)}">IMG</span>`;
    }
    function compactSongCell(item, score, bp, options = {}) {
      return `<button class="song-cell level-cell ${item.image_url ? "has-image" : ""}" data-chart="${escapeText(item.chart_id || "")}">
        ${leftRailHtml(item)}
        <div class="level-main">
          <div class="title"><span class="title-name">${escapeText(item.title)}</span><span class="title-diff">[${escapeText(item.difficulty || "")}]</span></div>
          <div class="meta">${levelSubInfoHtml(item, score, bp, options)}</div>
        </div>
        <div class="level-score"><div class="rankdiff">${rankDiffHtml(item, "-")}</div><div class="rate">${pct(item.score_rate)}</div></div>
        ${imageRailHtml(item)}
      </button>`;
    }

    function renderPlainList(label, rows, options = {}) {
      clearSelectionMode();
      setTitle(label);
      setStats(options.stats || [["ITEMS", rows.length], ["NOTES", fmt(options.notes || 0)], ["", ""]]);
      $("content").innerHTML = `${options.before || ""}<div class="plain-list">${rows.length ? rows.map(options.row).join("") : '<div class="empty">NO DATA</div>'}</div>`;
      document.querySelectorAll("[data-daily]").forEach((button) => button.addEventListener("click", () => openDailyDate(button.dataset.daily, true)));
      document.querySelectorAll("[data-daily-month]").forEach((button) => button.addEventListener("click", () => openDailyMonth(button.dataset.dailyMonth, true)));
      document.querySelectorAll("[data-daily-year]").forEach((button) => button.addEventListener("click", () => openDailyYear(button.dataset.dailyYear, true)));
      document.querySelectorAll("[data-folder]").forEach((button) => button.addEventListener("click", () => openFolder(button.dataset.folder, true)));
      document.querySelectorAll("[data-daily-mode]").forEach((input) => input.addEventListener("change", () => {
        if (input.checked) openDailyRoot(input.value, false);
      }));
    }

    function dailyModeControls(mode) {
      return `<div class="mode-tabs">
        ${["daily", "monthly", "yearly"].map((value) => `<label><input type="radio" name="dailyMode" data-daily-mode value="${value}" ${mode === value ? "checked" : ""}>${value}</label>`).join("")}
      </div>`;
    }
    function renderDailyFolders(data) {
      const mode = data.mode || "daily";
      if (data.folder.id === "daily") state.dailyMode = mode;
      renderPlainList(data.folder.label, data.items || [], {
        notes: data.total_notes,
        before: data.folder.id === "daily" ? dailyModeControls(mode) : "",
        stats: [["ITEMS", (data.items || []).length], ["NOTES", fmt(data.total_notes || 0)], ["MODE", mode.toUpperCase()]],
        row: (item) => {
          if (item.year) {
            return `<button class="plain-row" data-daily-year="${escapeText(item.year)}"><div><div class="title"><span class="title-name">${escapeText(item.year)}</span></div><div class="meta">${item.month_count} months / ${item.play_count} plays</div></div><div class="score-block"><div class="score">${fmt(item.notes)}</div><div class="subscore">notes</div></div></button>`;
          }
          if (item.month) {
            return `<button class="plain-row" data-daily-month="${escapeText(item.month)}"><div><div class="title"><span class="title-name">${escapeText(item.month)}</span></div><div class="meta">${item.day_count} days / ${item.play_count} plays</div></div><div class="score-block"><div class="score">${fmt(item.notes)}</div><div class="subscore">notes</div></div></button>`;
          }
          return `<button class="plain-row" data-daily="${escapeText(item.date)}"><div><div class="title"><span class="title-name">${escapeText(item.date)}</span></div><div class="meta">${item.play_count} plays</div></div><div class="score-block"><div class="score">${fmt(item.notes)}</div><div class="subscore">notes</div></div></button>`;
        }
      });
    }

    function renderFolderList(data) {
      renderPlainList(data.folder.label, data.items || [], {
        notes: data.notes,
        stats: [["ITEMS", (data.items || []).length], ["NOTES", fmt(data.notes || 0)], ["", ""]],
        row: (item) => `<button class="plain-row" data-folder="${escapeText(item.id)}"><div><div class="title"><span class="title-name">${escapeText(item.label)}</span></div><div class="meta">${fmt(item.count)} charts</div></div><div class="score-block"><div class="score">${fmt(item.notes)}</div><div class="subscore">notes</div></div></button>`,
      });
    }

    function renderReceipt(data) {
      clearSelectionMode();
      state.receiptData = data;
      const openSections = {};
      document.querySelectorAll("details[data-section]").forEach((section) => {
        openSections[section.dataset.section] = section.open;
      });
      setTitle(data.folder.label);
      const logs = data.items || [];
      const topBpi = data.top_bpi_items || [];
      const scoreUpdates = filterSummaryResultRows(data.score_updates || []);
      const lampUpdates = filterSummaryResultRows(data.lamp_updates || []);
      const bpUpdates = filterSummaryResultRows(data.bp_updates || []);
      const current = data.current_detail;
      const rivals = data.rival_items || [];
      const tweet = data.tweet || {};
      setStats([]);
      const top = `<section class="metrics">
        <div class="metric"><span>SONGS</span><strong>${fmt(data.song_count)}</strong></div>
        <div class="metric"><span>SCORE RATE</span><strong>${escapeText(data.score_rate || "-")}</strong></div>
        <div class="metric"><span>NOTES</span><strong>${fmt(data.today_notes)}</strong></div>
        <div class="metric featured bpi"><span>TOP BPI</span><strong>${escapeText(data.top_bpi || "-")}</strong></div>
        <div class="metric"><span>RANGE</span><strong>${escapeText(data.range_text || "-")}</strong></div>
      </section>`;
      $("content").innerHTML = `${top}
        <section class="receipt-actions">
          <button id="summaryBtn" class="secondary-btn" type="button">Generate Summary</button>
          <button id="tweetBtn" class="tweet-btn" type="button">Tweet</button>
        </section>
        ${receiptSection("play-log", "Play Log", `${logs.length} / ${fmt(data.song_count)} songs`, logs, receiptSongRow, openSections)}
        ${receiptSection("top-bpi", "Top BPI", `${topBpi.length} charts`, topBpi, receiptBpiRow, openSections)}
        ${receiptSection("score-updates", "Score Updates", `${scoreUpdates.length} charts`, scoreUpdates, receiptScoreUpdateRow, openSections)}
        ${receiptSection("lamp-updates", "Lamp Updates", `${lampUpdates.length} charts`, lampUpdates, receiptLampUpdateRow, openSections)}
        ${receiptSection("bp-updates", "BP Updates", `${bpUpdates.length} charts`, bpUpdates, receiptBpUpdateRow, openSections)}
        ${receiptCurrentBest(current)}
        <section class="section">
          <div class="section-title">Rivals <span>${rivals.length} players</span></div>
          <div class="section-body">${rivals.length ? rivals.map(rivalRow).join("") : '<div class="empty">NO DATA</div>'}</div>
        </section>`;
      $("tweetBtn")?.addEventListener("click", async () => {
        const latest = await api(receiptApiPath());
        state.receiptData = latest;
        if (latest.tweet?.url) window.open(latest.tweet.url, "_blank", "noopener");
      });
      $("summaryBtn")?.addEventListener("click", async () => {
        const latest = await api(receiptApiPath());
        state.receiptData = latest;
        openReceiptSummaryImage(latest);
      });
      document.querySelectorAll("[data-chart]").forEach((button) => button.addEventListener("click", () => openChart(button.dataset.chart, true)));
      bindImageButtons($("content"));
