    const SUMMARY_LEVEL_SETTINGS_KEY = "infMobileSummaryLevelStats";
    const SUMMARY_PERIOD_SETTINGS_KEY = "infMobileSummaryPeriod";
    const SUMMARY_LIMIT_SETTINGS_KEY = "infMobileSummarySectionLimit";
    const SUMMARY_RESULT_LEVEL_SETTINGS_KEY = "infMobileSummaryResultLevels";

    function renderSummarySettings(data) {
      const panel = $("summarySettingsPanel");
      if (!panel) return;
      const entries = availableSummaryLevelEntries((data.summary_stats || {}).level_stats || {});
      const selected = new Set(loadSummaryLevelSelection(entries));
      const resultLevelEntries = availableSummaryLevelEntries({});
      const selectedResultLevels = new Set(loadSummaryResultLevelSelection(resultLevelEntries));
      const period = loadSummaryPeriodSettings();
      const limit = loadSummaryLimitSettings();
      const sectionRows = summaryLimitSections();
      panel.innerHTML = `<div class="summary-settings-title">Summary Settings</div>
        <details open>
          <summary>Period</summary>
          <div class="summary-settings-body">
            <div class="period-options">
              ${summaryPeriodOptions().map(([value, label]) => `<label><input type="radio" name="summaryPeriod" data-summary-period value="${value}" ${period.period === value ? "checked" : ""}>${label}</label>`).join("")}
            </div>
            <div class="custom-period">
              <input id="summaryStartDate" type="date" value="${escapeText(period.start_date || todayDateInputValue())}">
              <input id="summaryEndDate" type="date" value="${escapeText(period.end_date || todayDateInputValue())}">
            </div>
          </div>
        </details>
        <details open>
          <summary>Lv stats</summary>
          <div class="summary-settings-body">
            <div class="summary-level-options">${entries.map((entry) => `<label><input type="checkbox" data-summary-level="${escapeText(entry.id)}" ${selected.has(entry.id) ? "checked" : ""}>${escapeText(entry.label)}</label>`).join("") || '<div class="empty">NO DATA</div>'}</div>
          </div>
        </details>
        <details open>
          <summary>Result levels</summary>
          <div class="summary-settings-body">
            <div class="summary-level-options">${resultLevelEntries.map((entry) => `<label><input type="checkbox" data-summary-result-level="${escapeText(entry.id)}" ${selectedResultLevels.has(entry.id) ? "checked" : ""}>${escapeText(entry.label)}</label>`).join("")}</div>
          </div>
        </details>
        <details open>
          <summary>Section rows</summary>
          <div class="summary-settings-body">
            <div class="period-options">
              ${sectionRows.map((entry) => {
                const item = limit[entry.key] || { limit: 20, unlimited: false };
                return `<label>${escapeText(entry.label)} <input data-summary-limit="${entry.key}" type="number" min="0" max="999" value="${escapeText(item.limit)}" ${item.unlimited ? "disabled" : ""}></label>
                  ${entry.allowUnlimited ? `<label><input data-summary-unlimited="${entry.key}" type="checkbox" ${item.unlimited ? "checked" : ""}>${escapeText(entry.label)} Unlimited</label>` : ""}`;
              }).join("")}
            </div>
          </div>
        </details>`;
      panel.querySelectorAll("[data-summary-period]").forEach((input) => {
        input.addEventListener("change", () => {
          saveSummaryPeriodFromPanel(panel);
          refreshReceiptDataForSettings();
        });
      });
      ["summaryStartDate", "summaryEndDate"].forEach((id) => {
        panel.querySelector(`#${id}`)?.addEventListener("change", () => {
          saveSummaryPeriodFromPanel(panel);
          if ((panel.querySelector("[data-summary-period]:checked")?.value || "") === "custom") refreshReceiptDataForSettings();
        });
      });
      panel.querySelectorAll("[data-summary-level]").forEach((input) => {
        input.addEventListener("change", () => {
          const ids = [...panel.querySelectorAll("[data-summary-level]:checked")].map((node) => node.dataset.summaryLevel);
          saveSummaryLevelSelection(ids);
        });
      });
      panel.querySelectorAll("[data-summary-result-level]").forEach((input) => {
        input.addEventListener("change", () => {
          const ids = [...panel.querySelectorAll("[data-summary-result-level]:checked")].map((node) => node.dataset.summaryResultLevel);
          saveSummaryResultLevelSelection(ids);
        });
      });
      panel.querySelectorAll("[data-summary-unlimited]").forEach((input) => input.addEventListener("change", () => {
        saveSummaryLimitFromPanel(panel);
        renderSummarySettings(state.receiptData || data);
      }));
      panel.querySelectorAll("[data-summary-limit]").forEach((input) => input.addEventListener("change", () => saveSummaryLimitFromPanel(panel)));
    }

    async function refreshReceiptDataForSettings() {
      try {
        state.receiptData = await api(receiptApiPath());
      } catch (e) {
        renderError(e);
      }
    }

    async function openSummarySettingsPage(shouldPush = true) {
      if (state.view !== "receipt" && state.view !== "summary-settings") return;
      clearCurrentTimer();
      const addHistory = shouldPush && state.view !== "summary-settings";
      if (addHistory) push(state.view);
      state.view = "summary-settings";
      setTitle("SUMMARY SETTINGS");
      setStats([]);
      $("content").innerHTML = `<section id="summarySettingsPanel" class="summary-settings"></section>`;
      if (!state.receiptData) {
        try {
          state.receiptData = await api(receiptApiPath());
        } catch (e) {
          renderError(e);
          return;
        }
      }
      renderSummarySettings(state.receiptData);
      if (addHistory) pushHistoryState();
    }

    function summaryPeriodOptions() {
      return [
        ["app_start", "After app start"],
        ["last_play", "Last play day"],
        ["week", "Last 1 week"],
        ["month", "Last 1 month"],
        ["year", "Last 1 year"],
        ["custom", "Custom range"],
      ];
    }

    function todayDateInputValue() {
      const date = new Date();
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function loadSummaryPeriodSettings() {
      try {
        const parsed = JSON.parse(localStorage.getItem(SUMMARY_PERIOD_SETTINGS_KEY) || "{}");
        if (parsed && typeof parsed === "object") {
          return {
            period: parsed.period || "app_start",
            start_date: parsed.start_date || "",
            end_date: parsed.end_date || "",
          };
        }
      } catch (e) {}
      return { period: "app_start", start_date: "", end_date: "" };
    }

    function saveSummaryPeriodSettings(settings) {
      localStorage.setItem(SUMMARY_PERIOD_SETTINGS_KEY, JSON.stringify(settings));
    }

    function saveSummaryPeriodFromPanel(panel) {
      saveSummaryPeriodSettings({
        period: panel.querySelector("[data-summary-period]:checked")?.value || "app_start",
        start_date: panel.querySelector("#summaryStartDate")?.value || "",
        end_date: panel.querySelector("#summaryEndDate")?.value || "",
      });
    }

    function receiptApiPath() {
      const period = loadSummaryPeriodSettings();
      const params = new URLSearchParams();
      params.set("period", period.period || "app_start");
      if (period.period === "custom") {
        if (period.start_date) params.set("start_date", period.start_date);
        if (period.end_date) params.set("end_date", period.end_date);
      }
      return `/api/folders/receipt?${params.toString()}`;
    }

    function loadSummaryLimitSettings() {
      const defaults = defaultSummaryLimitSettings();
      try {
        const parsed = JSON.parse(localStorage.getItem(SUMMARY_LIMIT_SETTINGS_KEY) || "{}");
        if (parsed && typeof parsed === "object" && Object.prototype.hasOwnProperty.call(parsed, "limit")) {
          const oldLimit = Math.max(0, Math.floor(Number(parsed.limit) || 20));
          const oldUnlimited = Boolean(parsed.unlimited);
          return {
            top_bpi: { limit: oldLimit || 20, unlimited: false },
            score_updates: { limit: oldLimit, unlimited: oldUnlimited },
            lamp_updates: { limit: oldLimit, unlimited: oldUnlimited },
            bp_updates: { limit: oldLimit, unlimited: oldUnlimited },
          };
        }
        const result = { ...defaults };
        summaryLimitSections().forEach((entry) => {
          const item = parsed[entry.key] || {};
          result[entry.key] = {
            limit: Math.max(0, Math.floor(Number(item.limit) || 0)),
            unlimited: entry.allowUnlimited ? Boolean(item.unlimited) : false,
          };
          if (!Object.prototype.hasOwnProperty.call(item, "limit")) result[entry.key].limit = 20;
        });
        return result;
      } catch (e) {}
      return defaults;
    }

    function saveSummaryLimitFromPanel(panel) {
      const settings = defaultSummaryLimitSettings();
      summaryLimitSections().forEach((entry) => {
        const limitNode = panel.querySelector(`[data-summary-limit="${entry.key}"]`);
        const unlimitedNode = panel.querySelector(`[data-summary-unlimited="${entry.key}"]`);
        settings[entry.key] = {
          limit: Math.max(0, Math.floor(Number(limitNode?.value) || 0)),
          unlimited: entry.allowUnlimited ? Boolean(unlimitedNode?.checked) : false,
        };
      });
      localStorage.setItem(SUMMARY_LIMIT_SETTINGS_KEY, JSON.stringify(settings));
    }

    function defaultSummaryLimitSettings() {
      return {
        top_bpi: { limit: 20, unlimited: false },
        score_updates: { limit: 20, unlimited: false },
        lamp_updates: { limit: 20, unlimited: false },
        bp_updates: { limit: 20, unlimited: false },
      };
    }

    function summaryLimitSections() {
      return [
        { key: "top_bpi", label: "Top BPI", allowUnlimited: false },
        { key: "score_updates", label: "Score Updates", allowUnlimited: true },
        { key: "lamp_updates", label: "Lamp updates", allowUnlimited: true },
        { key: "bp_updates", label: "BP Updates", allowUnlimited: true },
      ];
    }

    function summarySectionLimit(key) {
      const settings = loadSummaryLimitSettings()[key] || { limit: 20, unlimited: false };
      return settings.unlimited ? Number.POSITIVE_INFINITY : Math.max(0, Math.floor(Number(settings.limit) || 0));
    }

    function availableSummaryLevelEntries(levelStats) {
      const labels = { sp: "SP", dp: "DP", battle: "DBx" };
      const order = ["sp", "dp"];
      const entries = [];
      order.forEach((style) => {
        for (let lv = 1; lv <= 12; lv += 1) {
          entries.push({ id: `${style}${lv}`, style, styleLabel: labels[style] || style.toUpperCase(), lv: String(lv), label: `${labels[style] || style.toUpperCase()} Lv${lv}` });
        }
      });
      return entries;
    }

    function defaultSummaryLevelSelection(entries) {
      const preferred = ["sp10", "sp11", "sp12"];
      const available = new Set(entries.map((entry) => entry.id));
      const defaults = preferred.filter((id) => available.has(id));
      return defaults.length ? defaults : entries.slice(0, 3).map((entry) => entry.id);
    }

    function loadSummaryLevelSelection(entries) {
      const available = new Set(entries.map((entry) => entry.id));
      try {
        const parsed = JSON.parse(localStorage.getItem(SUMMARY_LEVEL_SETTINGS_KEY) || "[]");
        const ids = Array.isArray(parsed) ? parsed.filter((id) => available.has(String(id))).map(String) : [];
        if (ids.length) return ids;
      } catch (e) {}
      return defaultSummaryLevelSelection(entries);
    }

    function saveSummaryLevelSelection(ids) {
      localStorage.setItem(SUMMARY_LEVEL_SETTINGS_KEY, JSON.stringify(ids));
    }

    function selectedSummaryLevelEntries(levelStats) {
      const entries = availableSummaryLevelEntries(levelStats || {});
      const selected = new Set(loadSummaryLevelSelection(entries));
      return entries.filter((entry) => selected.has(entry.id));
    }

    function defaultSummaryResultLevelSelection(entries) {
      return entries.map((entry) => entry.id);
    }

    function loadSummaryResultLevelSelection(entries) {
      const available = new Set(entries.map((entry) => entry.id));
      try {
        const raw = localStorage.getItem(SUMMARY_RESULT_LEVEL_SETTINGS_KEY);
        if (raw !== null) {
          const parsed = JSON.parse(raw || "[]");
          return Array.isArray(parsed) ? parsed.filter((id) => available.has(String(id))).map(String) : [];
        }
      } catch (e) {}
      return defaultSummaryResultLevelSelection(entries);
    }

    function saveSummaryResultLevelSelection(ids) {
      localStorage.setItem(SUMMARY_RESULT_LEVEL_SETTINGS_KEY, JSON.stringify(ids));
    }

    function selectedSummaryResultLevelSet() {
      const entries = availableSummaryLevelEntries({});
      return new Set(loadSummaryResultLevelSelection(entries));
    }

    function resultLevelId(item) {
      const difficulty = String(item.difficulty || "").toUpperCase();
      const lv = String(item.lv || "");
      if (!lv) return "";
      if (difficulty.startsWith("SP")) return `sp${lv}`;
      if (difficulty.startsWith("DP") || difficulty.startsWith("DB")) return `dp${lv}`;
      return "";
    }

    function filterSummaryResultRows(rows) {
      const selected = selectedSummaryResultLevelSet();
      return (rows || []).filter((item) => selected.has(resultLevelId(item)));
    }

    async function openReceiptSummaryImage(data) {
      if (!data.summary_stats) return;
      if (document.fonts?.ready) {
        await document.fonts.ready;
      }
      const canvas = document.createElement("canvas");
      canvas.width = 1500;
      canvas.height = estimateSummaryCanvasHeight(data);
      const ctx = canvas.getContext("2d");
      const height = drawSummaryCanvas(ctx, canvas.width, canvas.height, data);
      const trimmed = document.createElement("canvas");
      trimmed.width = canvas.width;
      trimmed.height = height;
      trimmed.getContext("2d").drawImage(canvas, 0, 0);
      const url = trimmed.toDataURL("image/png");
      const win = window.open("", "_blank");
      if (!win) return;
      win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Daily Summary</title><style>body{margin:0;background:#080816;display:flex;justify-content:center;}img{display:block;max-width:100%;height:auto;}</style></head><body><img src="${url}" alt="daily summary"></body></html>`);
      win.document.close();
    }

    function drawSummaryCanvas(ctx, w, h, data) {
      const stats = data.summary_stats || {};
      ctx.fillStyle = "#10112a";
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#070711";
      ctx.fillRect(10, 10, 465, h - 20);
      ctx.fillStyle = "#111336";
      ctx.fillRect(485, 10, w - 495, h - 20);

      const panel = (x, y, ww, hh, title = "") => {
        ctx.fillStyle = "#070711";
        roundRect(ctx, x, y, ww, hh, 8, true, false);
        ctx.strokeStyle = "#24294d";
        ctx.lineWidth = 1;
        roundRect(ctx, x, y, ww, hh, 8, false, true);
        if (title) {
          ctx.fillStyle = "#002777";
          roundRect(ctx, x, y, ww, 47, 8, true, false);
          ctx.strokeStyle = "#0058ad";
          roundRect(ctx, x, y, ww, 47, 8, false, true);
          drawText(ctx, title, x + 12, y + 32, 26, "#aaddff", "bold");
        }
      };

      panel(10, 10, 465, 160);
      if (isSingleSummaryRange(data)) {
        drawText(ctx, stats.date || "", 65, 68, 48, "#ffffff", "bold");
        drawText(ctx, summaryRangeText(data), 25, 92, 16, "#8899bb", "bold");
      } else {
        drawText(ctx, summaryRangeText(data), 25, 72, 26, "#ffffff", "bold");
      }
      drawText(ctx, "notes:", 25, 120, 25, "#aaddff", "bold");
      drawText(ctx, fmt(data.today_notes || 0), 130, 120, 27, "#50ff5f", "bold");
      drawText(ctx, "plays:", 25, 153, 25, "#aaddff", "bold");
      drawText(ctx, fmt(stats.playcount || data.play_count || 0), 122, 153, 27, "#ffff66", "bold");
      drawText(ctx, "rate:", 220, 153, 25, "#aaddff", "bold");
      drawText(ctx, stats.score_rate || data.score_rate || "-", 300, 153, 27, "#ffff66", "bold");

      panel(10, 180, 465, 265);
      drawNotesBars(ctx, stats.daily_notes || [], 22, 210, 430, 150);
      drawPeriodCards(ctx, stats.monthly_notes || [], stats.yearly_notes, 22, 389, 440);

      panel(10, 458, 465, 430, "Lv Hist");
      drawLevelHist(ctx, data.level_distribution || stats.today_level_distribution || {}, 22, 510, 440, 350);

      const levelStatEntries = selectedSummaryLevelEntries(stats.level_stats || {});
      const lvStatsHeight = Math.max(110, 55 + levelStatEntries.length * 185);
      panel(10, 898, 465, lvStatsHeight, "Lv stats");
      drawLevelStats(ctx, stats.level_stats || {}, 22, 945, 440, levelStatEntries);

      const topLimit = summarySectionLimit("top_bpi");
      const scoreLimit = summarySectionLimit("score_updates");
      const lampLimit = summarySectionLimit("lamp_updates");
      const bpLimit = summarySectionLimit("bp_updates");
      let rightY = 18;
      const topRows = data.top_bpi_items || [];
      let topBottom = rightY;
      if (topLimit !== 0) {
        const topHeight = summarySectionHeight(topRows.length, topLimit, 900);
        topBottom = drawSummaryList(ctx, "Top BPI", topRows, 495, rightY, 990, topHeight, (item) => [
          "", fmt(item.score), pct(item.score_rate), item.rankdiff || "", visibleBpiText(item) || "", item.title || "",
        ], { kind: "ranked", limit: topLimit });
        rightY = topBottom + 18;
      }
      const scoreUpdateRows = sortedScoreUpdatesForImage(filterSummaryResultRows(data.score_updates || []));
      let scoreBottom = rightY;
      if (scoreLimit !== 0) {
        const scoreHeight = summarySectionHeight(scoreUpdateRows.length, scoreLimit, 900);
        scoreBottom = drawSummaryList(ctx, summarySectionTitle("Score Updates", scoreUpdateRows.length, scoreLimit), scoreUpdateRows, 495, rightY, 990, scoreHeight, (item) => [
          "", fmt(item.score), pct(item.score_rate), item.rankdiff || "", "+" + fmt((Number(item.score) || 0) - (Number(item.pre_score) || 0)), item.title || "",
        ], { kind: "ranked", limit: scoreLimit });
        rightY = scoreBottom + 18;
      }
      let lampBottom = rightY;
      if (lampLimit !== 0) {
        lampBottom = drawSummaryGroupedUpdates(ctx, "Lamp updates", filterSummaryResultRows(data.lamp_updates || []), 495, rightY, 990, Number.isFinite(lampLimit) ? 900 : Number.POSITIVE_INFINITY, lampLimit);
        rightY = lampBottom + 18;
      }
      const bpRows = sortedBpUpdatesForImage(filterSummaryResultRows(data.bp_updates || []));
      let bpBottom = rightY;
      if (bpLimit !== 0) {
        const bpHeight = summarySectionHeight(bpRows.length, bpLimit, 900);
        bpBottom = drawSummaryList(ctx, summarySectionTitle("BP Updates", bpRows.length, bpLimit), bpRows, 495, rightY, 990, bpHeight, (item) => [
          "", fmt(item.bp), "-" + fmt((Number(item.pre_bp) || 0) - (Number(item.bp) || 0)), "", "", item.title || "",
        ], { kind: "bp", limit: bpLimit });
        rightY = bpBottom + 18;
      }
      const leftBottom = 898 + lvStatsHeight;
      const contentBottom = Math.max(1650, leftBottom, topBottom, scoreBottom, lampBottom, bpBottom) + 12;
      ctx.fillStyle = "#10112a";
      ctx.fillRect(0, contentBottom, w, h - contentBottom);
      return Math.min(h, Math.ceil(contentBottom));
    }

    function summaryRangeText(data) {
      const raw = String((data.summary_stats || {}).range_text || data.range_text || "");
      const parts = raw.split(":");
      return parts.length > 1 ? parts.slice(1).join(":").trim() : raw;
    }

    function isSingleSummaryRange(data) {
      const start = Number(data.start_time) || 0;
      const end = Number(data.end_time) || 0;
      if (!start || !end) return true;
      const startDate = new Date(start * 1000).toDateString();
      const endDate = new Date((end - 1) * 1000).toDateString();
      return startDate === endDate;
    }

    function sortedScoreUpdatesForImage(rows) {
      return [...rows].sort((a, b) => {
        const deltaA = (Number(a.score) || 0) - (Number(a.pre_score) || 0);
        const deltaB = (Number(b.score) || 0) - (Number(b.pre_score) || 0);
        return deltaB - deltaA || (Number(b.timestamp) || 0) - (Number(a.timestamp) || 0);
      });
    }

    function sortedBpUpdatesForImage(rows) {
      return [...rows].sort((a, b) => {
        const deltaA = (Number(a.pre_bp) || 0) - (Number(a.bp) || 0);
        const deltaB = (Number(b.pre_bp) || 0) - (Number(b.bp) || 0);
        return deltaB - deltaA || (Number(b.timestamp) || 0) - (Number(a.timestamp) || 0);
      });
    }

    function summarySectionHeight(rowCount, limit, maxHeight) {
      const displayRows = Math.min(rowCount, Number.isFinite(limit) ? limit : rowCount);
      const omittedRows = rowCount > displayRows ? 1 : 0;
      return Math.max(95, 60 + (displayRows + omittedRows) * 35);
    }

    function summarySectionTitle(title, total, limit) {
      const count = Number(total) || 0;
      if (!Number.isFinite(limit)) return { text: title, count: String(count), truncated: false };
      const shown = Math.min(count, Math.max(0, Math.floor(Number(limit) || 0)));
      return { text: title, count: shown < count ? `${shown} / ${count}` : String(count), truncated: shown < count };
    }

    function estimateSummaryCanvasHeight(data) {
      const stats = data.summary_stats || {};
      const topLimit = summarySectionLimit("top_bpi");
      const scoreLimit = summarySectionLimit("score_updates");
      const lampLimit = summarySectionLimit("lamp_updates");
      const bpLimit = summarySectionLimit("bp_updates");
      const levelStatEntries = selectedSummaryLevelEntries(stats.level_stats || {});
      const leftBottom = 898 + Math.max(110, 55 + levelStatEntries.length * 185);
      let rightY = 18;
      if (topLimit !== 0) rightY += summarySectionHeight((data.top_bpi_items || []).length, topLimit, 900) + 18;
      if (scoreLimit !== 0) rightY += summarySectionHeight(filterSummaryResultRows(data.score_updates || []).length, scoreLimit, 900) + 18;
      if (lampLimit !== 0) rightY += summaryGroupedUpdatesHeight(filterSummaryResultRows(data.lamp_updates || []), lampLimit, Number.isFinite(lampLimit) ? 900 : Number.POSITIVE_INFINITY) + 18;
      if (bpLimit !== 0) rightY += summarySectionHeight(filterSummaryResultRows(data.bp_updates || []).length, bpLimit, 900) + 18;
      return Math.ceil(Math.max(1650, leftBottom, rightY) + 50);
    }

    function drawText(ctx, text, x, y, size, color = "#fff", weight = "normal", align = "left") {
      ctx.font = `${weight} ${size}px "RocknRoll One", system-ui, sans-serif`;
      ctx.fillStyle = color;
      ctx.textAlign = align;
      ctx.textBaseline = "alphabetic";
      ctx.fillText(String(text ?? ""), x, y);
    }

    function roundRect(ctx, x, y, w, h, r, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      if (fill) ctx.fill();
      if (stroke) ctx.stroke();
    }

    function drawNotesBars(ctx, dailyNotes, x, y, w, h) {
      const rows = dailyNotes.slice(-7);
      const totals = rows.map((d) => (Number(d.pg) || 0) + (Number(d.gr) || 0) + (Number(d.gd) || 0) + (Number(d.bd) || 0));
      const maxTotal = Math.max(1, ...totals);
      drawText(ctx, "Notes", x, y + 14, 19, "#aaddff", "bold");
      rows.forEach((d, i) => {
        const total = totals[i];
        const bx = x + 15 + i * 62;
        const bh = Math.round(total / maxTotal * 120);
        drawText(ctx, fmt(total), bx + 15, y + 15 + (120 - bh), 16, "#ffff99", "bold", "center");
        ctx.fillStyle = "#00a6ff";
        ctx.fillRect(bx, y + 35 + (120 - bh), 30, bh);
        ctx.fillStyle = "#00d4dd";
        ctx.fillRect(bx, y + 35 + (120 - bh), 30, Math.round(bh * 0.25));
        ctx.fillStyle = "#ffb300";
        ctx.fillRect(bx, y + 35 + 120 - 12, 30, Math.min(12, bh));
        drawText(ctx, d.date || "", bx + 15, y + 177, 16, "#aaddff", "bold", "center");
      });
    }

    function drawPeriodCards(ctx, monthlyNotes, yearlyNotes, x, y, w) {
      const cards = [...monthlyNotes.slice(-3), yearlyNotes].filter(Boolean);
      cards.forEach((item, i) => {
        const cw = 105;
        const cx = x + i * 112;
        ctx.fillStyle = "#181a2c";
        roundRect(ctx, cx, y, cw, 48, 5, true, false);
        ctx.strokeStyle = "#303552";
        roundRect(ctx, cx, y, cw, 48, 5, false, true);
        drawText(ctx, item.label || "", cx + cw / 2, y + 16, 13, "#aaddff", "bold", "center");
        drawText(ctx, shortNotes(item.notes), cx + cw / 2, y + 39, 22, i === cards.length - 1 ? "#ff66ff" : "#ffbb77", "bold", "center");
      });
    }

    function shortNotes(value) {
      const n = Number(value) || 0;
      if (n >= 1000000) return (n / 1000000).toFixed(n >= 10000000 ? 0 : 1) + "M";
      if (n >= 1000) return Math.round(n / 1000) + "k";
      return String(n);
    }

    function drawLevelHist(ctx, dist, x, y, w, h) {
      let total = 0;
      Object.values(dist).forEach((e) => total += (e.sp || 0) + (e.dp || 0) + (e.battle || 0));
      total = Math.max(1, total);
      for (let lv = 1; lv <= 12; lv++) {
        const e = dist[String(lv)] || {};
        const rowY = y + (lv - 1) * 28;
        const count = (e.sp || 0) + (e.dp || 0) + (e.battle || 0);
        drawText(ctx, `☆${lv}`, x, rowY + 18, 21, "#ffff28", "bold");
        ctx.fillStyle = "#1b1b31";
        ctx.fillRect(x + 52, rowY + 5, 335, 18);
        let ox = x + 52;
        [["sp", "#ff6666"], ["dp", "#55d68b"], ["battle", "#8060ff"]].forEach(([key, color]) => {
          const ww = Math.round(((e[key] || 0) / total) * 335);
          if (ww > 0) {
            ctx.fillStyle = color;
            ctx.fillRect(ox, rowY + 5, ww, 18);
            ox += ww;
          }
        });
        drawText(ctx, count ? (count / total * 100).toFixed(1) + "%" : "", x + 440, rowY + 19, 18, "#ffffff", "bold", "right");
      }
    }

    function drawLevelStats(ctx, levelStats, x, y, w, entries) {
      if (!entries.length) {
        drawText(ctx, "No levels selected", x + 10, y + 34, 20, "#888888", "bold");
        return;
      }
      entries.forEach((entry, i) => {
        const data = (levelStats[entry.style] || {})[entry.lv] || {};
        const cy = y + i * 185;
        ctx.fillStyle = "#11122b";
        roundRect(ctx, x, cy, w, 170, 6, true, false);
        ctx.strokeStyle = "#202646";
        roundRect(ctx, x, cy, w, 170, 6, false, true);
        drawText(ctx, `${entry.styleLabel} Lv${entry.lv}`, x + 10, cy + 34, 27, "#ff7777", "bold");
        drawLampSummaryText(ctx, data.lamps || {}, x + 10, cy + 62, 19);
        drawStackBar(
          ctx,
          data.lamps || {},
          ["fc", "exh", "hard", "clear", "easy", "assist", "failed"],
          ["#ffaa44", "#ffff44", "#ff4444", "#44bbff", "#44ff44", "#ff66ff", "#888888"],
          x + 10,
          cy + 78,
          w - 20,
          20
        );
        drawText(ctx, `AAA:${((data.scores || {}).AAA) || 0}`, x + 10, cy + 126, 19, "#ffff28", "bold");
        drawStackBar(ctx, data.scores || {}, ["AAA", "AA", "A", "B_below"], ["#ffff28", "#c3c3c3", "#44cc77", "#4444ff"], x + 10, cy + 140, w - 20, 20);
      });
    }

    function lampSummaryText(lamps) {
      return [["fc", "FC"], ["exh", "EXH"], ["hard", "H"], ["clear", "N"], ["easy", "E"], ["assist", "A"], ["failed", "F"]]
        .filter(([key]) => lamps[key])
        .map(([key, label]) => `${label}:${lamps[key]}`)
        .join(", ");
    }

    function drawLampSummaryText(ctx, lamps, x, y, size) {
      let ox = x;
      lampSummaryParts(lamps).forEach((part, index) => {
        const text = `${index ? ", " : ""}${part.label}:${part.value}`;
        drawText(ctx, text, ox, y, size, part.color, "bold");
        const oldFont = ctx.font;
        ctx.font = `bold ${size}px "RocknRoll One", system-ui, sans-serif`;
        ox += ctx.measureText(text).width;
        ctx.font = oldFont;
      });
    }

    function lampSummaryParts(lamps) {
      return [
        ["fc", "FC", "#ffaa44"],
        ["exh", "EXH", "#ffff44"],
        ["hard", "H", "#ff6666"],
        ["clear", "N", "#44bbff"],
        ["easy", "E", "#44ff44"],
        ["assist", "A", "#ff66ff"],
        ["failed", "F", "#888888"],
      ]
        .filter(([key]) => lamps[key])
        .map(([key, label, color]) => ({ key, label, color, value: lamps[key] }));
    }

    function drawStackBar(ctx, data, keys, colors, x, y, w, h) {
      const total = keys.reduce((sum, key) => sum + (Number(data[key]) || 0), 0);
      ctx.fillStyle = "#1b1b31";
      ctx.fillRect(x, y, w, h);
      if (!total) return;
      let ox = x;
      keys.forEach((key, i) => {
        const ww = Math.round((Number(data[key]) || 0) / total * w);
        if (ww > 0) {
          ctx.fillStyle = colors[i];
          ctx.fillRect(ox, y, ww, h);
          ox += ww;
        }
      });
    }

    function drawSummaryList(ctx, title, rows, x, y, w, h, mapper, options = {}) {
      ctx.fillStyle = "#05050c";
      roundRect(ctx, x, y, w, h, 7, true, false);
      ctx.fillStyle = "#002777";
      roundRect(ctx, x, y, w, 47, 7, true, false);
      ctx.strokeStyle = "#0058ad";
      roundRect(ctx, x, y, w, 47, 7, false, true);
      drawSummarySectionHeader(ctx, title, x + 12, y + 32, 24);
      const maxRows = Math.max(1, Math.floor((h - 58) / 35));
      const limit = Number.isFinite(options.limit) ? options.limit : rows.length;
      const shownRows = Math.min(maxRows, limit);
      rows.slice(0, shownRows).forEach((item, i) => drawSummaryRow(ctx, mapper(item), x + 18, y + 80 + i * 35, w - 35, item, options.kind || "ranked"));
      if (rows.length > shownRows || title.truncated) drawVerticalEllipsis(ctx, x + w / 2, y + 80 + shownRows * 35);
      return y + h;
    }

    function drawSummarySectionHeader(ctx, title, x, y, size) {
      if (!title || typeof title !== "object") {
        drawText(ctx, title, x, y, size, "#aaddff", "bold");
        return;
      }
      drawText(ctx, title.text || "", x, y, size, "#aaddff", "bold");
      const labelWidth = measureTextImage(ctx, title.text || "", size);
      if (title.count) drawText(ctx, ` ${title.count}`, x + labelWidth + 4, y, size, "#9aa3b5", "bold");
    }

    function drawVerticalEllipsis(ctx, x, y) {
      drawText(ctx, ".", x, y - 18, 22, "#9aa3b5", "bold", "center");
      drawText(ctx, ".", x, y - 9, 22, "#9aa3b5", "bold", "center");
      drawText(ctx, ".", x, y, 22, "#9aa3b5", "bold", "center");
    }

    function drawSummaryRow(ctx, values, x, y, w, item = {}, kind = "ranked") {
      const cols = [0, 220, 330, 430, 550, 650];
      values.forEach((value, i) => {
        if (i === 0) {
          drawLevelTextImage(ctx, item, x + cols[i], y, 205);
          return;
        }
        if (kind === "ranked" && i === 3 && String(value || "")) {
          drawRankDiffImage(ctx, item, value, x + cols[i], y);
          return;
        }
        const color = i === 1 && kind === "bp" ? "#aaffaa" : i === 2 && kind === "bp" ? "#33ddff" : i === 2 && kind === "ranked" ? "#c8d4e8" : i === 4 && kind === "ranked" ? bpiImageColor(value) : i === values.length - 1 ? difficultyImageColor(item.difficulty) : "#f4f6f8";
        const size = i === 2 && kind === "ranked" ? 14 : i === values.length - 1 ? 20 : 18;
        drawText(ctx, value, x + (cols[i] || (i * 90)), y, size, color, "bold");
      });
    }

    function drawLevelTextImage(ctx, item, x, y, maxWidth = 110) {
      const difficulty = String(item.difficulty || "").toUpperCase();
      const clear = item.sp_12clear || "";
      const hard = item.sp_12hard || "";
      if (String(item.lv || "") === "12" && difficulty.startsWith("SP") && (clear || hard)) {
        const clearText = clear || "?";
        const hardText = hard || "?";
        const sepWidth = measureTextImage(ctx, "/", 16);
        const clearSize = fitTextSizeImage(ctx, clearText, 16, maxWidth * 0.48);
        const hardSize = fitTextSizeImage(ctx, hardText, 16, maxWidth * 0.48);
        drawText(ctx, clearText, x, y, clearSize, "#bbddff", "bold");
        const clearWidth = measureTextImage(ctx, clearText, clearSize);
        drawText(ctx, "/", x + clearWidth, y, 16, "#f4f6f8", "bold");
        drawText(ctx, hardText, x + clearWidth + sepWidth, y, hardSize, "#ffaaaa", "bold");
        return;
      }
      const text = levelTextForImage(item);
      drawText(ctx, text, x, y, fitTextSizeImage(ctx, text, 18, maxWidth), "#ffff28", "bold");
    }

    function measureTextImage(ctx, text, size) {
      const oldFont = ctx.font;
      ctx.font = `bold ${size}px "RocknRoll One", system-ui, sans-serif`;
      const width = ctx.measureText(String(text ?? "")).width;
      ctx.font = oldFont;
      return width;
    }

    function fitTextSizeImage(ctx, text, baseSize, maxWidth) {
      let size = baseSize;
      while (size > 11 && measureTextImage(ctx, text, size) > maxWidth) size -= 1;
      return size;
    }

    function drawRankDiffImage(ctx, item, value, x, y) {
      const raw = String(value || "");
      const match = raw.match(/^(MAX|AAA|AA|A|B|C|D|E|F)(.*)$/);
      if (!match) {
        drawText(ctx, raw, x, y, 18, "#f4f6f8", "bold");
        return;
      }
      const rankText = raw === "MAX+0" ? "MAX" : match[1];
      const tailText = raw === "MAX+0" ? "" : match[2] || "";
      const color = rankImageColor(rankClassFromScoreRate(Number(item.score_rate) || 0));
      drawText(ctx, rankText, x, y, 18, color, "bold");
      const oldFont = ctx.font;
      ctx.font = `bold 18px "RocknRoll One", system-ui, sans-serif`;
      const rankWidth = ctx.measureText(rankText).width;
      ctx.font = oldFont;
      if (tailText) drawText(ctx, tailText, x + rankWidth, y, 18, "#a6adb7", "bold");
    }

    function rankClassFromScoreRate(scoreRate) {
      if (scoreRate >= 1) return "MAX";
      if (scoreRate * 18 >= 16) return "AAA";
      if (scoreRate * 18 >= 14) return "AA";
      if (scoreRate * 18 >= 12) return "A";
      if (scoreRate * 18 >= 10) return "B";
      if (scoreRate * 18 >= 8) return "C";
      if (scoreRate * 18 >= 6) return "D";
      if (scoreRate * 18 >= 4) return "E";
      return scoreRate > 0 ? "F" : "";
    }

    function rankImageColor(rank) {
      return {
        MAX: "#ff66ff",
        AAA: "#ffff28",
        AA: "#c3c3c3",
        A: "#2ddf71",
        B: "#7777ff",
        C: "#7777ff",
        D: "#7777ff",
        E: "#7777ff",
        F: "#7777ff",
      }[rank] || "#f4f6f8";
    }

    function bpiImageColor(value) {
      const n = Number(value);
      return Number.isFinite(n) && n > 0 ? "#50ff5f" : "#a0a83f";
    }

    function drawSummaryGroupedUpdates(ctx, title, rows, x, y, w, h, limit = Number.POSITIVE_INFINITY) {
      const groups = groupLampUpdatesForImage(rows, limit);
      const actualHeight = summaryGroupedUpdatesHeight(rows, limit, h);
      ctx.fillStyle = "#05050c";
      roundRect(ctx, x, y, w, actualHeight, 7, true, false);
      ctx.fillStyle = "#002777";
      roundRect(ctx, x, y, w, 47, 7, true, false);
      ctx.strokeStyle = "#0058ad";
      roundRect(ctx, x, y, w, 47, 7, false, true);
      drawText(ctx, title, x + 12, y + 32, 24, "#aaddff", "bold");

      let cy = y + 77;
      groups.forEach((group) => {
        if (cy > y + actualHeight - 32) return;
        ctx.fillStyle = lampImageColor(group.lamp);
        roundRect(ctx, x + 18, cy - 16, 17, 17, 3, true, false);
        const label = `New ${group.label}`;
        drawText(ctx, label, x + 44, cy, 20, "#ffffff", "bold");
        drawText(ctx, ` ${group.total}`, x + 44 + measureTextImage(ctx, label, 20) + 4, cy, 20, "#9aa3b5", "bold");
        cy += 34;
        group.items.forEach((item) => {
          if (cy > y + actualHeight - 20) return;
          drawLevelTextImage(ctx, item, x + 90, cy, 190);
          drawText(ctx, item.title || "", x + 300, cy, 20, difficultyImageColor(item.difficulty), "bold");
          cy += 31;
        });
        if (group.total > group.items.length) {
          drawVerticalEllipsis(ctx, x + w / 2, cy + 6);
          cy += 35;
        }
        cy += 12;
        if (cy < y + actualHeight - 10) {
          ctx.strokeStyle = "#24243d";
          ctx.beginPath();
          ctx.moveTo(x, cy - 9);
          ctx.lineTo(x + w, cy - 9);
          ctx.stroke();
        }
      });
      return y + actualHeight;
    }

    function summaryGroupedUpdatesHeight(rows, limit = Number.POSITIVE_INFINITY, maxHeight = Number.POSITIVE_INFINITY) {
      let neededHeight = 77;
      const groups = groupLampUpdatesForImage(rows, limit);
      groups.forEach((group) => {
        neededHeight += 34 + group.items.length * 31 + 12;
        if (group.total > group.items.length) neededHeight += 35;
      });
      return Math.max(95, neededHeight + 8);
    }

    function groupLampUpdatesForImage(rows, limit = Number.POSITIVE_INFINITY) {
      const labels = {
        7: "FC",
        6: "EXH",
        5: "Hard",
        4: "Clear",
        3: "Easy",
        2: "Assist",
        1: "Failed",
      };
      const order = [7, 6, 5, 4, 3, 2, 1];
      const groups = {};
      (rows || []).forEach((item) => {
        const lamp = Number(item.lamp) || 0;
        const preLamp = Number(item.pre_lamp) || 0;
        if (lamp <= preLamp) return;
        if (!groups[lamp]) groups[lamp] = [];
        groups[lamp].push(item);
      });
      return order
        .filter((lamp) => groups[lamp]?.length)
        .map((lamp) => {
          const total = groups[lamp].length;
          const maxItems = Number.isFinite(limit) ? Math.max(0, Math.floor(limit)) : Number.POSITIVE_INFINITY;
          const items = groups[lamp].slice(0, maxItems);
          return { lamp, label: labels[lamp] || "Lamp", total, items };
        })
        .filter((group) => group.items.length);
    }

    function lampImageColor(lamp) {
      return {
        7: "#44bbff",
        6: "#ffff44",
        5: "#ffffff",
        4: "#22ccff",
        3: "#22ff22",
        2: "#ff66ff",
        1: "#333333",
      }[Number(lamp)] || "#777777";
    }

    function difficultyImageColor(difficulty) {
      const text = String(difficulty || "").toUpperCase();
      const diffType = text.length >= 3 ? text.charAt(2) : "";
      return {
        A: "#ff8888",
        H: "#ffff88",
        N: "#8888ff",
        L: "#ff88ff",
        B: "#88ff88",
      }[diffType] || "#ffcccc";
    }

    function levelTextForImage(item) {
      const difficulty = String(item.difficulty || "").toUpperCase();
      if (difficulty.startsWith("DP") && item.dp_unofficial_lv) return `☆${item.lv} ${item.dp_unofficial_lv}`;
      return `☆${item.lv || ""}`;
    }

    function receiptSection(id, title, count, rows, rowRenderer, openSections = {}) {
      const openAttr = openSections[id] === false ? "" : " open";
      return `<details class="section" data-section="${escapeText(id)}"${openAttr}>
        <summary class="section-title">${escapeText(title)} <span>${escapeText(count)}</span></summary>
        <div class="section-body">${rows.length ? rows.map(rowRenderer).join("") : '<div class="empty">NO DATA</div>'}</div>
      </details>`;
    }
    function receiptTitle(item) {
      return `<b>${levelHtml(item)} ${escapeText(item.title)} [${escapeText(item.difficulty || "")}]</b>`;
    }
    function dpUnofficialHtml(item) {
      if (!isDpChart(item) || !item.dp_unofficial_lv) return "";
      return `<span class="dp-unofficial">${escapeText(item.dp_unofficial_lv)}</span>`;
    }
    function levelHtml(item) {
      const difficulty = String(item.difficulty || "");
      if (isDpChart(item)) {
        return `<span class="lv-token">☆${escapeText(item.lv || "")}</span>${item.dp_unofficial_lv ? ` <span class="dp-unofficial">${escapeText(item.dp_unofficial_lv)}</span>` : ""}`;
      }
      const isSp12 = String(item.lv || "") === "12" && difficulty.startsWith("SP");
      const clear = item.sp_12clear || "";
      const hard = item.sp_12hard || "";
      if (isSp12 && (clear || hard)) {
        return `<span class="unofficial-lv"><span class="unofficial-easy">${escapeText(clear || "?")}</span><span class="unofficial-sep">/</span><span class="unofficial-hard">${escapeText(hard || "?")}</span></span>`;
      }
      return `<span class="lv-token">Lv${escapeText(item.lv || "")}</span>`;
    }
    function levelUnofficialHtml(item) {
      const difficulty = String(item.difficulty || "");
      const isSp12 = String(item.lv || "") === "12" && difficulty.startsWith("SP");
      const clear = item.sp_12clear || "";
      const hard = item.sp_12hard || "";
      if (!isSp12 || (!clear && !hard)) return "";
      return `<span class="unofficial-lv"><span class="unofficial-easy">${escapeText(clear || "?")}</span><span class="unofficial-sep">/</span><span class="unofficial-hard">${escapeText(hard || "?")}</span></span>`;
    }
    function levelMarkerText(item) {
      const lv = String(item.lv || "");
      if (!lv) return "";
      const band = String(item.katate_band || "");
      if (item.enable_katate_difficulty_display && band) return `☆${lv}-${band}`;
      return `☆${lv}`;
    }
    function levelMarkerHtml(item) {
      const text = levelMarkerText(item);
      if (!text) return "";
      const cls = item.enable_katate_difficulty_display && item.katate_band ? " katate" : "";
      return `<span class="level-info level-marker${cls}">${escapeText(text)}</span>`;
    }
    function levelSubInfoHtml(item, score, bp, options = {}) {
      const parts = [];
      const marker = options.showLevelMarker ? levelMarkerHtml(item) : "";
      if (marker) parts.push(marker);
      const dpUnofficial = dpUnofficialHtml(item);
      if (dpUnofficial) parts.push(dpUnofficial);
      const unofficial = levelUnofficialHtml(item);
      if (unofficial) parts.push(unofficial);
      if (visibleBpiText(item)) parts.push(bpiHtml(visibleBpiText(item)));
      const ereter = ereterHtml(item, { mini: true });
      if (ereter) parts.push(ereter);
      parts.push(`<span class="level-info">EX${fmt(score)}</span>`);
      parts.push(`<span class="level-info">BP${fmt(bp)}</span>`);
      return parts.join("");
    }
    function ereterItems(item) {
      if (!isDpChart(item)) return [];
      const lamp = Number(item.best_lamp ?? item.lamp) || 0;
      return [
        ["easy", "easy", item.dp_ereter_easy, lamp >= 3],
        ["hard", "hard", item.dp_ereter_hard, lamp >= 5],
        ["ereter-exh", "exh", item.dp_ereter_exh, lamp >= 6],
      ].filter((entry) => entry[2]);
    }
    function ereterHtml(item, options = {}) {
      const items = ereterItems(item);
      if (!items.length) return "";
      const cls = options.mini ? "ereter-mini" : "ereter-strip";
      return `<span class="${cls}">${items.map(([kind, label, value, achieved]) => `<span class="ereter-box ${kind}"><span class="ereter-mark ${achieved ? "ok" : "ng"}">${achieved ? "✓" : "×"}</span><b>${escapeText(label)}</b><strong>${escapeText(value)}</strong></span>`).join("")}</span>`;
    }
    function rankClassFromItem(item) {
      const scoreRate = Number(item.score_rate) || Number(item.best_score_rate) || 0;
      if (scoreRate >= 1) return "MAX";
      if (scoreRate * 18 >= 16) return "AAA";
      if (scoreRate * 18 >= 14) return "AA";
      if (scoreRate * 18 >= 12) return "A";
      if (scoreRate * 18 >= 10) return "B";
      if (scoreRate * 18 >= 8) return "C";
      if (scoreRate * 18 >= 6) return "D";
      if (scoreRate * 18 >= 4) return "E";
      return scoreRate > 0 ? "F" : "";
    }
    function rankDiffHtml(item, fallback = "") {
      let rankdiff0 = String(item.rankdiff0 || "");
      let rankdiff1 = String(item.rankdiff1 || "");
      const raw = String(item.rankdiff || "");
      if (!rankdiff0 && !rankdiff1 && raw) {
        const match = raw.match(/^(MAX|AAA|AA|A|B|C|D|E|F)(.*)$/);
        if (match) {
          rankdiff0 = match[1];
          rankdiff1 = match[2] || "";
        }
      }
      const text = rankdiff0 || rankdiff1 ? rankdiff0 + rankdiff1 : raw;
      if (!text) return escapeText(fallback);
      const rank = rankClassFromItem(item);
      if (!rank) return escapeText(text);
      if (text === "MAX+0") return `<span class="rank-diff rank-MAX">MAX</span>`;
      return `<span class="rank-diff rank-${escapeText(rank)}">${escapeText(rankdiff0 || text)}</span><span class="rank-diff-tail">${escapeText(rankdiff0 ? rankdiff1 : "")}</span>`;
    }
    function receiptSongRow(item) {
      const score = item.score ?? item.best_score;
      const bp = item.bp ?? item.best_bp;
      return compactSongCell(item, score, bp, { showLevelMarker: true });
    }
    function receiptBpiRow(item) {
      return `<div class="row" data-chart="${escapeText(item.chart_id || "")}"><div class="row-score">${visibleBpiText(item) ? bpiHtml(visibleBpiText(item)) : ""}</div><div>${receiptTitle(item)}<span>${pct(item.score_rate)} ${rankDiffHtml(item)}</span></div><div class="row-score">${fmt(item.score)}<span>BP ${fmt(item.bp)}</span></div></div>`;
    }
    function receiptScoreUpdateRow(item) {
      const delta = (Number(item.score) || 0) - (Number(item.pre_score) || 0);
      const bpi = visibleBpiText(item);
      const ereter = ereterHtml(item, { mini: true });
      return `<div class="row" data-chart="${escapeText(item.chart_id || "")}"><div class="delta">+${fmt(delta)}</div><div>${receiptTitle(item)}<span>${pct(item.score_rate)} ${rankDiffHtml(item)}${bpi ? " / " + bpiHtml(bpi) : ""}${ereter ? " " + ereter : ""}</span></div><div class="row-score">${fmt(item.score)}<span>prev ${fmt(item.pre_score)}</span></div></div>`;
    }
    function receiptLampUpdateRow(item) {
      const ereter = ereterHtml(item, { mini: true });
      return `<div class="row" data-chart="${escapeText(item.chart_id || "")}">${lampHtml(item.lamp, item.lamp_text)}<div>${receiptTitle(item)}<span>from ${escapeText(item.pre_lamp_text || item.pre_lamp || "")}${ereter ? " " + ereter : ""}</span></div><div class="row-score">${fmt(item.score)}<span>BP ${fmt(item.bp)}</span></div></div>`;
    }
    function receiptBpUpdateRow(item) {
      const delta = (Number(item.pre_bp) || 0) - (Number(item.bp) || 0);
      const ereter = ereterHtml(item, { mini: true });
      return `<div class="row" data-chart="${escapeText(item.chart_id || "")}"><div class="delta">-${fmt(delta)}</div><div>${receiptTitle(item)}<span>${escapeText(item.opt || "")}${ereter ? " " + ereter : ""}</span></div><div class="row-score">BP ${fmt(item.bp)}<span>prev ${fmt(item.pre_bp)}</span></div></div>`;
    }
    function receiptCurrentBest(data) {
      if (!data) {
        return `<section class="section"><div class="section-title">Current Best <span>no current song</span></div><div class="section-body"><div class="empty">NO CURRENT SONG</div></div></section>`;
      }
      return `<section class="section">
        <div class="section-title">Current Best <span>${escapeText(data.difficulty || "")}</span></div>
        <div class="section-body">
          <div class="row" data-chart="${escapeText(data.chart_id || "")}">${lampHtml(data.best_lamp, data.best_lamp_text)}<div><b>${escapeText(data.music || data.title || "")}</b><span>${levelMarkerHtml(data) || levelHtml(data)}${dpUnofficialHtml(data) ? " " + dpUnofficialHtml(data) : ""} / NOTES ${fmt(data.notes)}</span></div><div class="row-score">${fmt(data.best_score)}<span>BP ${fmt(data.best_bp)}${visibleBpiText(data) ? " / " + bpiHtml(visibleBpiText(data)) : ""}</span></div></div>
          ${isDpChart(data) ? ereterHtml(data) : isDbxChart(data) ? "" : arenaAverageHtml(data, "receipt-arena")}
        </div>
      </section>`;
    }

    function arenaAverageHtml(data, extraClass = "") {
      const averages = [...(data.bpi_near_averages || [])];
      if (!averages.length) return "";
      const rankOrder = { A1: 1, A2: 2, A3: 3, A4: 4, A5: 5 };
      averages.sort((a, b) => (rankOrder[b.rank] || 99) - (rankOrder[a.rank] || 99));
      const bestScore = Number(data.best_score ?? data.score);
      return `<div class="arena-averages ${extraClass}">${averages.map((avg) => {
        const score = Number(avg.score) || 0;
        const diff = Number.isFinite(bestScore) ? bestScore - score : null;
        const diffText = diff == null ? "" : `${diff >= 0 ? "+" : ""}${fmt(diff)}`;
        const diffClass = diff == null || diff >= 0 ? "positive" : "negative";
        const rank = String(avg.rank || "").toUpperCase();
        return `<div class="arena-row"><span class="arena-rank arena-rank-${escapeText(rank.toLowerCase())}">${escapeText(rank)}</span><span class="arena-label">平均</span><span class="arena-score">EX${fmt(score)}</span><span class="arena-diff ${diffClass}">${escapeText(diffText)}</span></div>`;
      }).join("")}</div>`;
    }

    function renderDetail(data, options = {}) {
      clearSelectionMode();
      setTitle(options.title || data.music || data.title || "DETAIL");
      const logs = data.items || [];
      const rivals = data.rival_items || [];
      const isDp = isDpChart(data);
      const isDbx = isDbxChart(data);
      const bpiMetric = isDp || isDbx ? "" : `<div class="metric featured bpi"><span>${escapeText(data.best_bpi_label || "BPI")}</span><strong>${escapeText(data.best_bpi || "-")}</strong></div>`;
      setStats([]);
      $("content").innerHTML = `
        <section class="detail-head">
          <div class="detail-title">${escapeText(data.music || data.title)}</div>
          <div class="pill-row">
            <span class="pill">${levelMarkerHtml(data) || "-"}</span>
            ${dpUnofficialHtml(data) ? `<span class="pill">${dpUnofficialHtml(data)}</span>` : ""}
            <span class="pill">${escapeText(data.difficulty || "")}</span>
            <span class="pill">NOTES ${fmt(data.notes)}</span>
          </div>
        </section>
        <section class="metrics">
          <div class="metric"><span>BEST SCORE</span><strong>${fmt(data.best_score)}</strong></div>
          <div class="metric"><span>BEST BP</span><strong>${fmt(data.best_bp)}</strong></div>
          ${bpiMetric}
          <div class="metric"><span>BEST RATE</span><strong>${pct(data.best_score_rate)}</strong></div>
        </section>
        ${isDp ? ereterHtml(data) : isDbx ? "" : arenaAverageHtml(data)}
        <section class="section">
          <div class="section-title">Rivals <span>${rivals.length} players</span></div>
          <div class="section-body">${rivals.length ? rivals.map(rivalRow).join("") : '<div class="empty">NO DATA</div>'}</div>
        </section>
        <section class="section">
          <div class="section-title">Play Log <span>${logs.length} plays</span></div>
          <div class="section-body">${logs.length ? logs.map((item) => logRow(item, data)).join("") : '<div class="empty">NO DATA</div>'}</div>
        </section>`;
      bindImageButtons($("content"));
    }
    function renderCurrentSong(data) {
      clearSelectionMode();
      state.view = "current";
      setTitle("CURRENT SONG");
      if (!data.detail) {
        setStats([]);
        $("content").innerHTML = `<div class="empty">NO CURRENT SONG</div>`;
        return;
      }
      renderDetail(data.detail, { title: "CURRENT SONG" });
    }
    function rivalRow(item) {
      return `<div class="row">${lampHtml(item.lamp, item.lamp_text)}<div><b>${item.rank}. ${escapeText(item.player)}</b><span>${escapeText(item.option || "")}</span></div><div class="row-score">${fmt(item.score)}<span>BP ${fmt(item.bp)}</span></div></div>`;
    }
    function logRow(item, chart = {}) {
      const merged = { ...chart, ...item, difficulty: item.difficulty || chart.difficulty };
      const score = merged.score ?? merged.best_score;
      const bp = merged.bp ?? merged.best_bp;
      return `<button class="song-cell level-cell ${merged.image_url ? "has-image" : ""}" data-chart="${escapeText(chart.chart_id || "")}">
        ${leftRailHtml(merged)}
        <div class="level-main">
          <div class="title"><span class="title-name">${escapeText(merged.date || "")}</span></div>
          <div class="meta">${levelSubInfoHtml(merged, score, bp, { showLevelMarker: false })}${merged.opt ? `<span class="level-info">${escapeText(merged.opt)}</span>` : ""}</div>
        </div>
        <div class="level-score"><div class="rankdiff">${rankDiffHtml(merged, "-")}</div><div class="rate">${pct(merged.score_rate)}</div></div>
        ${imageRailHtml(merged)}
      </button>`;
    }
    function renderError(e) { $("content").innerHTML = `<div class="error">${escapeText(e.message || e)}</div>`; }

    async function openFolder(id, shouldPush) {
      clearCurrentTimer();
      if (shouldPush) push(state.view);
      try {
        if (id === "history") {
          state.historyOffset = 0;
          const data = await api("/api/folders/history?limit=200&offset=0");
          state.view = "history";
          state.historyOffset = data.items.length;
          state.historyTotal = data.total;
          renderList(data.folder.label, data.items, { loadMore: data.items.length < data.total, variant: "compact" });
        } else if (id === "saved-images") {
          state.view = "saved-images";
          renderSavedImagesList(await api("/api/folders/saved-images"));
        } else if (id === "bpi-best") {
          const data = await api("/api/folders/bpi-best");
          state.view = "bpi-best";
          renderList(data.folder.label, data.items, { notes: data.notes, variant: "compact" });
        } else if (id === "receipt") {
          state.view = "receipt";
          renderReceipt(await api(receiptApiPath()));
          state.receiptTimer = setInterval(() => refreshReceipt(), 5000);
        } else if (id === "daily") {
          state.view = "daily";
          await openDailyRoot(state.dailyMode || "daily", false);
        } else {
          const data = await api(`/api/folders/${id}`);
          state.view = id;
          if (id === "current") {
            renderCurrentSong(data);
            state.currentTimer = setInterval(() => refreshCurrent(), 2000);
          } else if (data.type === "folder-list") {
            renderFolderList(data);
          } else {
            const isLevelList = id.includes("level/") || id.includes("/band/");
            renderList(data.folder.label, data.items, { notes: data.notes, variant: isLevelList ? "level" : "", sortControls: isLevelList });
          }
        }
        if (shouldPush) pushHistoryState();
      } catch (e) {
        renderError(e);
      }
    }
    async function openDailyRoot(mode = "daily", shouldPush = true) {
      clearCurrentTimer();
      if (shouldPush) push(state.view);
      try {
        const data = await api(`/api/folders/daily?mode=${encodeURIComponent(mode)}`);
        state.view = "daily";
        renderDailyFolders(data);
        if (shouldPush) pushHistoryState();
      } catch (e) { renderError(e); }
    }
    async function openDailyMonth(monthKey, shouldPush) {
      clearCurrentTimer();
      if (shouldPush) push(state.view);
      try {
        const data = await api(`/api/folders/daily/month/${encodeURIComponent(monthKey)}`);
        state.view = `daily-month:${monthKey}`;
        renderDailyFolders(data);
        if (shouldPush) pushHistoryState();
      } catch (e) { renderError(e); }
    }
    async function openDailyYear(yearKey, shouldPush) {
      clearCurrentTimer();
      if (shouldPush) push(state.view);
      try {
        const data = await api(`/api/folders/daily/year/${encodeURIComponent(yearKey)}`);
        state.view = `daily-year:${yearKey}`;
        renderDailyFolders(data);
        if (shouldPush) pushHistoryState();
      } catch (e) { renderError(e); }
    }
    async function openDailyDate(dateKey, shouldPush) {
      clearCurrentTimer();
      if (shouldPush) push(state.view);
      try {
        const data = await api(`/api/folders/daily/${encodeURIComponent(dateKey)}`);
        state.view = `daily:${dateKey}`;
        renderList(data.folder.label, data.items, { notes: data.notes, variant: "level" });
        if (shouldPush) pushHistoryState();
      } catch (e) { renderError(e); }
    }
    async function refreshCurrent() {
      try {
        const data = await api("/api/folders/current");
        renderCurrentSong(data);
      } catch (e) { renderError(e); }
    }
    async function refreshReceipt() {
      if (state.view !== "receipt") return;
      try {
        renderReceipt(await api(receiptApiPath()));
      } catch (e) { renderError(e); }
    }
    async function loadMoreHistory() {
      const data = await api(`/api/folders/history?limit=200&offset=${state.historyOffset}`);
      state.historyOffset += data.items.length;
      state.allItems = state.allItems.concat(data.items);
      applyFilter();
      if (state.historyOffset >= state.historyTotal) $("loadMore")?.remove();
    }
    async function openChart(chartId, shouldPush) {
      if (!chartId) return;
      clearCurrentTimer();
      if (shouldPush) push(state.view);
      try {
        state.view = `chart:${chartId}`;
        renderDetail(await api(`/api/charts/${encodeURIComponent(chartId)}`));
        if (shouldPush) pushHistoryState();
      } catch (e) { renderError(e); }
    }
    async function loadHome() {
      clearCurrentTimer();
      state.view = "home";
      state.stack = [];
      try {
        renderHome(await api("/api/folders"));
        replaceHistoryState();
      } catch (e) { renderError(e); }
    }
    async function openView(view, shouldPush) {
      if (!view || view === "home") await loadHome();
      else if (view.startsWith("chart:")) await openChart(view.slice(6), shouldPush);
      else if (view.startsWith("daily-month:")) await openDailyMonth(view.slice(12), shouldPush);
      else if (view.startsWith("daily-year:")) await openDailyYear(view.slice(11), shouldPush);
      else if (view.startsWith("daily:")) await openDailyDate(view.slice(6), shouldPush);
      else if (view === "summary-settings") await openSummarySettingsPage(shouldPush);
      else await openFolder(view, shouldPush);
    }
    async function goUpOneLevel(rewriteHistory = true) {
      const previous = state.stack.pop();
      if (!previous) {
        if (confirm("終了しますか？")) window.history.back();
        return;
      }
      await openView(previous, false);
      if (rewriteHistory) replaceHistoryState();
    }

    $("backBtn").addEventListener("click", () => goUpOneLevel(true));
    $("homeBtn").addEventListener("click", () => loadHome());
    $("refreshBtn").addEventListener("click", () => openView(state.view, false));
    $("settingsBtn").addEventListener("click", () => openSummarySettingsPage(true));
    $("viewTitle").addEventListener("click", () => {
      $("content").scrollTo({ top: 0, behavior: "smooth" });
      window.scrollTo({ top: 0, behavior: "smooth" });
      document.documentElement.scrollTo?.({ top: 0, behavior: "smooth" });
      document.body.scrollTo?.({ top: 0, behavior: "smooth" });
    });
    window.addEventListener("popstate", (event) => {
      if (event.state && event.state.kind === HISTORY_APP) {
        state.stack = Array.isArray(event.state.stack) ? [...event.state.stack] : [];
        openView(event.state.view, false);
        return;
      }
      if (state.stack.length > 0) {
        goUpOneLevel(false).then(() => pushHistoryState());
        return;
      }
      if (!event.state || event.state.kind === HISTORY_BASE) {
        if (confirm("終了しますか？")) window.history.back();
        else window.history.pushState(currentHistoryState(), "", window.location.href);
      }
    });

    initBrowserBackControl();
    loadHome();
  </script>
</body>
</html>
