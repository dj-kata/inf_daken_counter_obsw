<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>RANDOM lane</title>
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; }
    #layout {
      color: white; font: 700 64px/1.1 sans-serif; letter-spacing: .12em;
      text-shadow: 0 0 5px #000, 2px 2px 3px #000; white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="layout"></div>
  <script>
    function render() {
      const state = window.INFDC_RANDOM_LANE_STATE || {};
      document.getElementById('layout').textContent = state.phase === 'confirmed' ? state.layout : '';
    }
    function reloadState() {
      const old = document.getElementById('random-lane-state');
      if (old) old.remove();
      const script = document.createElement('script');
      script.id = 'random-lane-state';
      script.src = 'random_lane_state.js?t=' + Date.now();
      script.onload = render;
      document.head.appendChild(script);
    }
    reloadState();
    setInterval(reloadState, 250);
  </script>
</body>
</html>
