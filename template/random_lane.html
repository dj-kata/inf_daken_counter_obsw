<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>RANDOM lane</title>
  <link rel="stylesheet" href="../out/websocket.css">
  <link rel="stylesheet" href="lane_option.css">
  <script src="lane_option.js"></script>
  <style>
    :root {
      /* 1: 最後の配置（未取得なら灰色の枠7つ）を常時表示、0: プレー中の配置・部分配置のみ表示 */
      --show-when-idle: 0;
    }
    html, body { margin: 0; background: transparent; overflow: hidden; }
    #layout {
      display: flex; width: max-content; font-size: 90px;
    }
  </style>
</head>
<body>
  <div id="layout"></div>
  <script>
    const lastLayoutKey = 'infdc.randomLane.lastLayout';
    const emptyLayout = '<span class="lane-option" role="img" aria-label="レーン配置未取得">' +
      '<span class="lane-option-key lane-option-key-unknown"></span>'.repeat(7) + '</span>';
    let lastLayout = '';
    // Keep the last display available when OBS reloads the browser source, too.
    try {
      lastLayout = localStorage.getItem(lastLayoutKey) || '';
    } catch (_) {
      // Some local-file browser sources do not allow storage.
    }

    function render() {
      const state = window.INFDC_RANDOM_LANE_STATE || {};
      const layout = document.getElementById('layout');
      const active = ['recording', 'registered', 'ready', 'analyzing', 'partial', 'confirmed',
        'failed', 'needs_normal'].includes(state.phase);
      const current = active ? renderLaneOptionToken(state.option || 'RANDOM', state.layout) : '';
      if (current && state.layout !== lastLayout) {
        lastLayout = state.layout;
        try {
          localStorage.setItem(lastLayoutKey, lastLayout);
        } catch (_) {}
      }
      const showWhenIdle = getComputedStyle(document.body)
        .getPropertyValue('--show-when-idle').trim() === '1';
      const retained = renderLaneOptionToken('RANDOM', lastLayout);
      layout.innerHTML = active
        ? current
        : showWhenIdle ? retained || emptyLayout : '';
    }
    function getWebSocketPort() {
        const queryPort = parseInt(new URLSearchParams(window.location.search).get('websocket_port'), 10);
        if (Number.isFinite(queryPort)) {
            return queryPort;
        }

        const port = getComputedStyle(document.documentElement)
            .getPropertyValue('--websocket-port').trim();
        return parseInt(port) || 8767;
    }

    function getWebSocketHost() {
        const queryHost = (new URLSearchParams(window.location.search).get('websocket_host') || '').trim().replace(/['"]/g, '');
        if (queryHost) {
            return queryHost;
        }

        const host = getComputedStyle(document.documentElement)
            .getPropertyValue('--websocket-host').trim().replace(/['"]/g, '');
        if (host) {
            return host;
        }

        const locationHost = window.location.hostname;
        if (!locationHost || locationHost.toLowerCase() === 'absolute') {
            return '127.0.0.1';
        }

        return locationHost;
    }

    function getWebSocketUrl() {
        return `ws://${getWebSocketHost()}:${getWebSocketPort()}`;
    }
    let ws = null;
    let reconnectTimer = null;
    let activeWebSocketUrl = '';
    function connectWebSocket() {
      activeWebSocketUrl = getWebSocketUrl();
      ws = new WebSocket(activeWebSocketUrl);
      ws.onmessage = function(event) {
        try {
          const message = JSON.parse(event.data);
          if (message.type === 'random_lane') {
            window.INFDC_RANDOM_LANE_STATE = message.data;
            render();
          }
        } catch (error) {
          console.error('RANDOM配置の受信エラー:', error);
        }
      };
      ws.onclose = function() {
        if (reconnectTimer === null) {
          reconnectTimer = setTimeout(function() {
            reconnectTimer = null;
            connectWebSocket();
          }, 3000);
        }
      };
    }
    render();
    connectWebSocket();
    setInterval(function() {
      if (activeWebSocketUrl !== getWebSocketUrl() && ws) ws.close();
    }, 1000);
  </script>
</body>
</html>
