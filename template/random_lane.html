<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>RANDOM lane</title>
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; }
    #layout {
      display: flex; gap: 1px; width: max-content;
    }
    .lane {
      flex: 0 0 60px; width: 60px; height: 100px;
      /* Each cell starts every 61px in the 487 x 100 sprite sheet. */
      background: url('random_pattern.png') no-repeat;
    }
  </style>
</head>
<body>
  <div id="layout"></div>
  <script>
    function render() {
      const state = window.INFDC_RANDOM_LANE_STATE || {};
      const layout = document.getElementById('layout');
      layout.replaceChildren();
      layout.removeAttribute('aria-label');
      if (state.phase !== 'confirmed' || !/^[1-7]{7}$/.test(state.layout || '')) return;

      const lanes = state.side === '2P' ? [...state.layout, 'S'] : ['S', ...state.layout];
      layout.setAttribute('role', 'img');
      layout.setAttribute('aria-label', lanes.join(' '));
      for (const lane of lanes) {
        const sprite = document.createElement('span');
        sprite.className = 'lane';
        const index = lane === 'S' ? 7 : Number(lane) - 1;
        sprite.style.backgroundPosition = `${-61 * index}px 0`;
        layout.appendChild(sprite);
      }
    }
    function reloadState() {
      const old = document.getElementById('random-lane-state');
      if (old) old.remove();
      const script = document.createElement('script');
      script.id = 'random-lane-state';
      script.src = 'random_lane_state.js?t=' + Date.now();
      script.onload = render;
      document.head.appendChild(script);
    }
    reloadState();
    setInterval(reloadState, 250);
  </script>
</body>
</html>
