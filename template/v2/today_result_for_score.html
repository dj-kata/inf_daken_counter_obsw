<!doctype html>
<!-- スコアラー向け？ -->
<html>
    <head>
        <meta charset="utf-8">
        <title>hoge</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=RocknRoll+One&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../../out/websocket.css">

        <style>
            body { 
            
            background-color: rgba(0, 0, 0, 0.99);
            margin: 0px;
            padding: 0px;
            overflow: hidden;
            font-family: 'RocknRoll One', sans-serif;
            color:#aaddff;   
            font-size: 64px;
            color: #fff;
            text-shadow: 6px 6px 0 #000,
                         -2px 2px 0 #000,
                         2px -2px 0 #000,
                         -2px -2px 0 #000;
            }
            :root{
                --skip-no-update: 0; /* スコアが伸びていないものを飛ばす */
            }
            div#all{
                min-height:2000px;
                background-color: rgba(0, 0, 0, 0.95);
            }
            table#title {
                padding-left: 20px;
                color: #aaddff;
                background-color: rgba(0, 0, 100, 0.95);
                font-size: 80px;
                line-height: 130%;
                width:100%;
            }
            table#result {
            	width:100%;
            }
            table#result td {
            	white-space:nowrap;
            }
            table#result td:nth-child(1) {
            	width:225px;
                color: #ffddaa;
                text-align: center;
                padding-right:20px;
            }
            table#result td:nth-child(3) {
            	overflow:hidden;
            	text-overflow:ellipsis;
            	max-width:90px;
                color: #bbffee;
            }
            table#result td:nth-child(2) {
            	width:40px;
                padding-right:20px;
            }
            table#result td:nth-child(4) {
            	width:170px;
            }
            table#result td:nth-child(5) {
            	width:1px;
            }
            table#result td:nth-child(6) {
                text-align:center;
            	width:320px;
            }
            table#result td:nth-child(7) {
                text-align:center;
                padding-right: 30px;
            	width:1px;
                font-size: 55px;
                color: #ffffaa;
            }
            .MAX{
                animation-name: flashmax;
                animation-duration: 0.4s;
                animation-iteration-count: infinite;
            }
            @keyframes flashmax {
                0%   { color: #ff2828; }
                20%  { color: #d5ff28; }
                40%  { color: #28ff7e; }
                60%  { color: #2872ff; }
                80%  { color: #d528ff; }
                100% { color: #ff2828; }
            }
            .AAA{
                color:#ffff28;
            }
            .AA{
                color:#c3c3c3;
            }
            .A{
                color:#2ddf71;
            }
            .B{
                color:#7777ff;
            }
            .C{
                color:#7777ff;
            }
            .D{
                color:#7777ff;
            }
            .E{
                color:#7777ff;
            }
            .F{
                color:#7777ff;
            }
            .fc{
                animation-name: flashfc;
                animation-duration: 0.2s;
                animation-iteration-count: infinite;
            }
            @keyframes flashfc {
                0%   { background-color: #ff2828; }
                20%  { background-color: #d5ff28; }
                40%  { background-color: #28ff7e; }
                60%  { background-color: #2872ff; }
                80%  { background-color: #d528ff; }
                100% { background-color: #ff2828; }
            }
            .failed{
                animation-name: flashfailed;
                animation-duration: 0.08s;
                animation-iteration-count: infinite;
            }
            @keyframes flashfailed {
                0%   { background-color: #ff2828; }
                50%  { background-color: #282828; }
                100% { background-color: #ff2828; }
            }
            .ac{background-color: #ff66ff;}
            .ec{background-color: #22ff22;}
            .nc{background-color: #22ccff;}
            .hc{background-color: #ffffff;}
            .exh{
                animation-name: flashexh;
                animation-duration: 0.08s;
                animation-iteration-count: infinite;
            }
            @keyframes flashexh {
                0%   { background-color: #ff2828; }
                50%  { background-color: #ffff28; }
                100% { background-color: #ff2828; }
            }
            /* SP☆12地力表用のスタイル */
            sp12hard{
                color:#ff86b4;
                padding: 0px;
                font-size: 50px;
            }
            sp12clear{
                color:#9ee7ff;
                padding: 0px;
                display: none;
                font-size: 50px;
            }
            score_plus{
                color: #ffcccc;
            }
            score_minus{
                color: #777799;
            }
            bpi_plus{
                color: #ffffaa;
            }
            bpi_minus{
                color: #777733;
            }
        </style>
    <body>
        <script>
        var isHard = 1;
        var ws = null;
        var reconnectInterval = null;

        function getWebSocketPort() {
            var port = getComputedStyle(document.documentElement).getPropertyValue('--websocket-port').trim();
            return parseInt(port) || 8767;
        }

        function connectWebSocket() {
            ws = new WebSocket('ws://localhost:' + getWebSocketPort());

            ws.onopen = function() {
                console.log('WebSocket接続成功');
                if (reconnectInterval) {
                    clearInterval(reconnectInterval);
                    reconnectInterval = null;
                }
            };

            ws.onmessage = function(event) {
                try {
                    var message = JSON.parse(event.data);
                    if (message.type === 'today_updates') {
                        updateTodayUpdates(message.data);
                    }
                } catch (error) {
                    console.error('メッセージ解析エラー:', error);
                }
            };

            ws.onclose = function() {
                console.log('WebSocket切断。3秒後に再接続します...');
                if (!reconnectInterval) {
                    reconnectInterval = setInterval(connectWebSocket, 3000);
                }
            };

            ws.onerror = function(error) {
                console.error('WebSocketエラー:', error);
            };
        }

        function getRank(scoreRate) {
            if (scoreRate * 18 > 16) return 'AAA';
            if (scoreRate * 18 > 14) return 'AA';
            if (scoreRate * 18 > 12) return 'A';
            if (scoreRate * 18 > 10) return 'B';
            if (scoreRate * 18 > 8) return 'C';
            if (scoreRate * 18 > 6) return 'D';
            if (scoreRate * 18 > 4) return 'E';
            return 'F';
        }

        function getLampHtml(lamp) {
            if (lamp == 1 || lamp == "FAILED") return '<span class="failed">　</span>';
            if (lamp == 2 || lamp == "A-CLEAR") return '<span class="ac">　</span>';
            if (lamp == 3 || lamp == "E-CLEAR") return '<span class="ec">　</span>';
            if (lamp == 4 || lamp == "CLEAR") return '<span class="nc">　</span>';
            if (lamp == 5 || lamp == "H-CLEAR") return '<span class="hc">　</span>';
            if (lamp == 6 || lamp == "EXH-CLEAR") return '<span class="exh">　</span>';
            if (lamp == 7 || lamp == "F-COMBO") return '<span class="fc">　</span>';
            return '';
        }

        function updateSp12Display() {
            document.querySelectorAll('sp12hard').forEach(function(el) {
                el.style.display = isHard == 1 ? 'none' : 'block';
            });
            document.querySelectorAll('sp12clear').forEach(function(el) {
                el.style.display = isHard == 1 ? 'block' : 'none';
            });
            isHard = 1 - isHard;
        }

        function updateTodayUpdates(data) {
            if (!data || !data.items) return;

                var out = "";
                var skip_no_update = getComputedStyle(document.documentElement).getPropertyValue('--skip-no-update');
                data.items.slice(0, 27).forEach(function(item, index){
                    var lv = "☆"+(item.lv || '');
                    var lamp = item.lamp;
                    var difficulty = item.difficulty || '';
                    if(item.dp_unofficial_lv){
                        lv = item.dp_unofficial_lv;
                    }
                    // SP☆12で地力表の難易度を表示(H/Cを時間で切り替える)
                    if(item.sp_12hard){
                        lv = '<sp12hard>'+item.sp_12hard+'</sp12hard>';
                        lv += '<sp12clear>'+(item.sp_12clear || '')+'</sp12clear>';
                    }
                    var title = item.title || '';
                    var score_pre = Number(item.pre_score) || 0;
                    var score_cur = Number(item.score) || 0;
                    var score_delta = score_cur - score_pre;
                    var score = (score_delta > 0 ? '+' : '') + score_delta;
                    if (skip_no_update == 1){
                        if (score_pre > score_cur){
                            return;
                        }
                    }
                    var rank = getRank(Number(item.score_rate) || 0);
                    var rankdiff = item.rankdiff || ((item.rankdiff0 || '') + (item.rankdiff1 || '')); // AAA+10のような表記
                    var rankdiff0 = item.rankdiff0 || ''; // AAA
                    rankdiff0 = '<span class="' + rank +'">'+rankdiff0+'</span>';
                    var rankdiff1 = item.rankdiff1 || ''; // AAA+10のような表記
                    var rank_update = '<span class="' + rank +'">'+rankdiff+'</span>';
                    rank_update = rankdiff0+rankdiff1;
                    if (rankdiff == "MAX+0"){
                        rank_update = '<span class="MAX">MAX!!</span>';
                    }
                    var opt = item.opt || '';
                    var bp = item.bp || 0;
                    var bpi = item.bpi || '';
                    if (bpi == "??"){
                        bpi='';
                    }
                    if (difficulty.slice(-1) == "N"){
                        difficulty = '<font color="#8888ff">'+difficulty+'</font>'
                    }
                    if (difficulty.slice(-1) == "H"){
                        difficulty = '<font color="#ffff88">'+difficulty+'</font>'
                    }
                    if (difficulty.slice(-1) == "A"){
                        difficulty = '<font color="#ff8888">'+difficulty+'</font>'
                    }
                    if (difficulty.slice(-1) == "L"){
                        difficulty = '<font color="#ff88ff">'+difficulty+'</font>'
                    }
                    lamp = getLampHtml(lamp);
                    // テーブルに追加
                    if (opt.indexOf("BATTLE") >= 0){ // DBx系オプションの場合、スコアの所にbp250のようにミスカンを入れておく
                        var with_scratch = "";
                        if (opt.indexOf("A-SCR")<0){
                            with_scratch = "皿あり"; // 皿あり表記を無効にする場合はこの行を消せばOK
                        }
                        if ((opt.indexOf("MIR / OFF")>=0) || (opt.indexOf("OFF / MIR")>=0) || (opt.indexOf("MIRROR / OFF")>=0) || (opt.indexOf("OFF / MIRROR")>=0)){
                            title = '('+with_scratch+'DBM) ' + title
                        }
                        else if ((opt.indexOf("OFF / OFF")>=0) || (opt.indexOf("REGULAR / REGULAR")>=0)){
                            title = '('+with_scratch+'DB) ' + title
                        }
                        else if ((opt.indexOf("RAN / RAN")>=0) || (opt.indexOf("RANDOM / RANDOM")>=0)){
                            title = '('+with_scratch+'DBR) ' + title
                        }
                        else if ((opt.indexOf("S-RAN / S-RAN")>=0) || (opt.indexOf("S-RANDOM / S-RANDOM")>=0)){
                            title = '('+with_scratch+'DBSR) ' + title
                        }
                        else if (opt.indexOf("H-RAN / H-RAN")>=0){
                            title = '('+with_scratch+'DBHR) ' + title
                        }
                        out += '<tr><td>'+lv+'</td>';
                        out += '<td>'+lamp+'</td>';
                        out += '<td>'+title+'</td>';
                        out += '<td>'+difficulty+'</td>';
                        out += '<td>bp'+bp+'</td>';
                        out += '<td></td></tr>';
                    } else{
                        out += '<tr><td>'+lv+'</td>';
                        out += '<td>'+lamp+'</td>';
                        out += '<td>'+title+'</td>';
                        out += '<td>'+difficulty+'</td>';
                        if (score.includes('+')){
                            out += '<td><score_plus>'+score+'</score_plus></td>';
                        }else{
                            out += '<td><score_minus>'+score+'</score_minus></td>';
                        }
                        out += '<td>'+rank_update+'</td>';
                        if (bpi.includes('-')){
                            out += '<td><bpi_minus>'+bpi+'</bpi_minus></td></tr>';
                        }else{
                            out += '<td><bpi_plus>'+bpi+'</bpi_plus></td></tr>';
                        }
                    }
                    });
                document.querySelector('#result tbody').innerHTML = out;
                updateSp12Display();
        }

        window.addEventListener('DOMContentLoaded', function() {
            connectWebSocket();
        });

        window.addEventListener('beforeunload', function() {
            if (ws) {
                ws.close();
            }
        });

</script>
</head>

    <table id="title">
      <tr><td>Recent update</td></tr>

      <thead>
        <tr>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </div>
</body>
</html>
