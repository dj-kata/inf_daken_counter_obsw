<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <title>hoge</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=RocknRoll+One&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../../out/websocket.css">
        <style>
            body { 
            background-color: rgba(0, 0, 0, 0.85);
            margin: 0px;
            padding: 0px;
            overflow: hidden;
            font-family:"RocknRoll One";
            color:#2196F3;   
            font-size: 64px;
            color: #fff;
            text-shadow: 6px 6px 0 #000,
                         -2px 2px 0 #000,
                         2px -2px 0 #000,
                         -2px -2px 0 #000;
            }
            div#all{
                min-height:2000px;
                background-color: rgba(0, 0, 0, 0.95);
            }
            table#title {
                padding-left: 20px;
                color: #aaddff;
                background-color: rgba(0, 0, 100, 0.95);
                font-size: 99px;
                line-height: 140%;
                width:100%;
            }
            table#title td{
            	white-space:nowrap;
            }
            table#title td:nth-child(1){
                width:13%;
            }
            table#title td:nth-child(2){
                max-width: 10px;
            	overflow:hidden;
            	text-overflow:ellipsis;
                padding-left:60px;
            }
            table#title td:nth-child(3){
                text-align: right;
                width:10%;
            }
            table#result {
                font-size: 96px;
            	width:100%;
            }
            table#result td {
            	white-space:nowrap;
            }
            table#result td:nth-child(1) {
            	width:22%;
            }
            table#result td:nth-child(2) {
            	width:5%;
            	margin-right:1%;
            }
            table#result td:nth-child(3) {
            	width:12%;
                text-align:right;
            }
            table#result td:nth-child(4) {
            	width:22%;
                text-align:center;
            }
            table#result td:nth-child(5) {
            	max-width:10px;
            	overflow:hidden;
            	text-overflow:ellipsis;
            }
            table#best {
                font-size: 80px;
            	width:100%;
            }
            table#best td {
            	white-space:nowrap;
            }
            table#best td:nth-child(1) {
                color:#ffccff;
                width:20%;
            }
            table#best td:nth-child(2) {
                color:#ffffff;
                width:15%;
                padding-right:3%;
                text-align:right;
            }
            table#best td:nth-child(3) {
                color:#cccccc;
                width:20%;
                padding-right:3%;
                text-align:center;
            }
            table#best td:nth-child(4) {
                text-align: center;
                max-width:10px;
                overflow:hidden;
                text-overflow:ellipsis;
                color:#77bb77;
            }
            .MAX{
                animation-name: flashmax;
                animation-duration: 0.4s;
                animation-iteration-count: infinite;
            }
            @keyframes flashmax {
                0%   { color: #ff2828; }
                20%  { color: #d5ff28; }
                40%  { color: #28ff7e; }
                60%  { color: #2872ff; }
                80%  { color: #d528ff; }
                100% { color: #ff2828; }
            }
            .AAA{
                color:#ffff28;
            }
            .AA{
                color:#c3c3c3;
            }
            .A{
                color:#2ddf71;
            }
            .B{
                color:#7777ff;
            }
            .C{
                color:#7777ff;
            }
            .D{
                color:#7777ff;
            }
            .E{
                color:#7777ff;
            }
            .F{
                color:#7777ff;
            }
            .fc{
                animation-name: flashfc;
                animation-duration: 0.2s;
                animation-iteration-count: infinite;
            }
            @keyframes flashfc {
                0%   { background-color: #ff2828; }
                20%  { background-color: #d5ff28; }
                40%  { background-color: #28ff7e; }
                60%  { background-color: #2872ff; }
                80%  { background-color: #d528ff; }
                100% { background-color: #ff2828; }
            }
            .failed{
                animation-name: flashfailed;
                animation-duration: 0.08s;
                animation-iteration-count: infinite;
            }
            @keyframes flashfailed {
                0%   { background-color: #ff2828; }
                50%  { background-color: #282828; }
                100% { background-color: #ff2828; }
            }
            .ac{background-color: #ff66ff;}
            .ec{background-color: #22ff22;}
            .nc{background-color: #22ccff;}
            .hc{background-color: #ffffff;}
            .exh{
                animation-name: flashexh;
                animation-duration: 0.08s;
                animation-iteration-count: infinite;
            }
            @keyframes flashexh {
                0%   { background-color: #ff2828; }
                50%  { background-color: #ffff28; }
                100% { background-color: #ff2828; }
            }
            sp12hard{
                color:#ff86b4;
                padding: 0px;
            }
            sp12clear{
                color:#9ee7ff;
                padding: 0px;
                display: none;
            }
        </style>
        <script>
        var isHard = 1;
        var ws = null;
        var reconnectInterval = null;

        function getWebSocketPort() {
            var port = getComputedStyle(document.documentElement).getPropertyValue('--websocket-port').trim();
            return parseInt(port) || 8767;
        }

        function connectWebSocket() {
            ws = new WebSocket('ws://localhost:' + getWebSocketPort());

            ws.onopen = function() {
                console.log('WebSocket接続成功');
                if (reconnectInterval) {
                    clearInterval(reconnectInterval);
                    reconnectInterval = null;
                }
            };

            ws.onmessage = function(event) {
                try {
                    var message = JSON.parse(event.data);
                    if (message.type === 'history_cursong') {
                        updateHistory(message.data);
                    }
                } catch (error) {
                    console.error('メッセージ解析エラー:', error);
                }
            };

            ws.onclose = function() {
                console.log('WebSocket切断。3秒後に再接続します...');
                if (!reconnectInterval) {
                    reconnectInterval = setInterval(connectWebSocket, 3000);
                }
            };

            ws.onerror = function(error) {
                console.error('WebSocketエラー:', error);
            };
        }

        function getRank(scoreRate) {
            if (scoreRate * 18 > 16) return 'AAA';
            if (scoreRate * 18 > 14) return 'AA';
            if (scoreRate * 18 > 12) return 'A';
            if (scoreRate * 18 > 10) return 'B';
            if (scoreRate * 18 > 8) return 'C';
            if (scoreRate * 18 > 6) return 'D';
            if (scoreRate * 18 > 4) return 'E';
            return 'F';
        }

        function getLampHtml(lamp) {
            if (lamp == 1 || lamp == "FAILED") return '<span class="failed">　</span>';
            if (lamp == 2 || lamp == "A-CLEAR") return '<span class="ac">　</span>';
            if (lamp == 3 || lamp == "E-CLEAR") return '<span class="ec">　</span>';
            if (lamp == 4 || lamp == "CLEAR") return '<span class="nc">　</span>';
            if (lamp == 5 || lamp == "H-CLEAR") return '<span class="hc">　</span>';
            if (lamp == 6 || lamp == "EXH-CLEAR") return '<span class="exh">　</span>';
            if (lamp == 7 || lamp == "F-COMBO") return '<span class="fc">　</span>';
            return '';
        }

        function updateSp12Display() {
            document.querySelectorAll('sp12hard').forEach(function(el) {
                el.style.display = isHard == 1 ? 'none' : 'block';
            });
            document.querySelectorAll('sp12clear').forEach(function(el) {
                el.style.display = isHard == 1 ? 'block' : 'none';
            });
            isHard = 1 - isHard;
        }

        function updateHistory(data) {
            if (!data) return;

                var out = "";
                var title = data.music || '';
                var lv = data.lv || '';
                if(data.dp_unofficial_lv){
                    var unoff_lv = data.dp_unofficial_lv;
                    lv = lv + "(" + unoff_lv + ") ";
                }
                //// today_resultと同様のアニメーション、いまいちなのでコメントアウトしている
                //if($(xml).find('Results sp_12hard').text().length){
                //    lv = lv+' <sp12hard>('+$(xml).find('Results sp_12hard').text()+')</sp12hard>';
                //    lv += '<sp12clear>('+$(xml).find('Results sp_12clear').text()+')</sp12clear>';
                //}
                var difficulty = data.difficulty || '';
                var best_score = Number(data.best_score) || 0;
                var best_bp = data.best_bp;
                var best_score_opt = data.best_score_opt || '';
                var best_bp_opt = data.best_bp_opt || '';
                var best_notes = Number(data.notes) || 0;
                var best_rank = getRank(Number(data.best_score_rate) || 0);
                var best_rankdiff0 = data.best_rankdiff0 || data.rankdiff0 || '';
                var best_rankdiff1 = data.best_rankdiff1 || data.rankdiff1 || '';
                var best_bpi = data.best_bpi || '??';
                var best_rankdiff = '-';
                if (best_rankdiff0 || best_rankdiff1) {
                var best_rankdiff = '<span class="' + best_rank +'">'+best_rankdiff0+'</span>'+best_rankdiff1; // 到達ランクの色をつける
                }
                var best_bp_rate = data.best_bp_rate || '';
                var notes = 0;
                document.querySelector("#title tbody").innerHTML = '<tr><td>☆'+lv+'</td><td>'+title+'</td><td>('+difficulty+')</td></tr>';
                (data.items || []).slice(0, 20).forEach(function(item, index){
                    var date = item.date || '';
                    var lamp = item.lamp;
                    var score = Number(item.score) || 0;
                    var opt = item.opt || '';
                    var bp = item.bp || 0;
                    notes = Number(item.notes) || best_notes;

                    var score_pre = Number(item.pre_score) || 0;
                    var rank = getRank(Number(item.score_rate) || 0);
                    var rank_pre = notes ? getRank(score_pre / notes / 2) : '';
                    var rankdiff0 = item.rankdiff0 || ''; // AAA
                    rankdiff0 = '<span class="' + rank +'">'+rankdiff0+'</span>'; // 到達ランクの色をつける
                    var rankdiff1 = item.rankdiff1 || ''; // +10
                    var rankdiff = rankdiff0+rankdiff1;
                    // 初AAAなどの達成時のみ表示する変数
                    var rank_update = '<span class="' + rank +'">'+rank+'</span>';
                    if ((score > score_pre) && (rank != rank_pre)){ // スコア伸び&ランク初到達
                        rank_update = '<span class="' + rank +'">'+rank+'</span>';
                    }
                    if ((score == notes*2) && (notes > 0)){
                        rank_update = '<span class="MAX">MAX</span>';
                        rankdiff = '<span class="MAX">MAX</span>'
                    }
                    // 毎回表示する場合の変数
                    rank = '<span class="' + rank +'">'+rank+'</span>';

                    var dbflg = false;
                    lamp = getLampHtml(lamp);
                    var with_scratch = "";
                    if (opt.indexOf("BATTLE")>=0){
                        dbflg = true;
                        if (opt.indexOf("A-SCR")<0){
                            with_scratch = ", 皿あり"; // 皿あり表記を無効にする場合はこの行を消せばOK
                        }
                    }
                    // 長いオプションを省略する(字をデカくするための施策,お好みで消してください)
                    if ((opt.indexOf("BATTLE, OFF / MIR")>=0) || (opt.indexOf("BATTLE, OFF / MIRROR")>=0)){
                        opt = '(DBM;右M' + with_scratch + ')'
                    }
                    else if ((opt.indexOf("BATTLE, MIR / OFF")>=0) || (opt.indexOf("BATTLE, MIRROR / OFF")>=0)){
                        opt = '(DBM;左M' + with_scratch + ')'
                    }
                    else if ((opt.indexOf("BATTLE, OFF / OFF")>=0) || (opt.indexOf("BATTLE, REGULAR / REGULAR")>=0)){
                        opt = '(DB' + with_scratch + ')'
                    }
                    else if ((opt.indexOf("BATTLE, RAN / RAN")>=0) || (opt.indexOf("BATTLE, RANDOM / RANDOM")>=0)){
                        opt = '(DBR' + with_scratch + ')'
                    }
                    else if ((opt.indexOf("BATTLE, S-RAN / S-RAN")>=0) || (opt.indexOf("BATTLE, S-RANDOM / S-RANDOM")>=0)){
                        opt = '(DBSR' + with_scratch + ')'
                    }
                    else if (opt.indexOf("BATTLE, H-RAN / H-RAN")>=0){
                        opt = '(DBHR' + with_scratch + ')'
                    }
                    else if (opt.indexOf("S-RAN / S-RAN, FLIP, LEGACY")>=0){
                        opt = '(全裸' + with_scratch + ')'
                    }
                    // テーブルに追加
                    if (dbflg == true){ // DBx系オプションの場合、スコアの所にbp250のようにミスカンを入れておく
                        out += '<tr><td><font color="#ffffaa">'+date+'</font></td>';
                        out += '<td>'+lamp+'</td>';
                        out += '<td>bp'+bp+'</td>';
                        out += '<td></td>';
                        out += '<td><font color="#aaffaa">'+opt+'</font></td>';
                        out += '</tr>'
                    }else{
                        out += '<tr><td><font color="#ffffaa">'+date+'</font></td>';
                        out += '<td>'+lamp+'</td>';
                        out += '<td>'+score+'</td>';
                        out += '<td>' + rankdiff + '</td>';
                        out += '<td><font color="#aaffaa">'+opt+'</font></td>';
                        out += '</tr>'
                    }
                });
                if ((best_score == best_notes*2) && (best_notes > 0)){
                    best_rankdiff = '<span class="MAX">MAX</span>'
                }
                var best_html = "";
                best_html += "<tr>";
                best_html += "<td>best(score)</td>";
                best_html += "<td>"+best_score+"</td>";
                best_html += "<td>("+best_rankdiff+")</td>";
                best_html += "<td>"+best_score_opt+"</td></tr>";
                // bpi(ある場合のみ)
                if (best_bpi != "??"){
                    best_html += "<tr>";
                    best_html += "<td>BPI</td>";
                    best_html += "<td>"+best_bpi+"</td>";
                    best_html += "<td></td>";
                    best_html += "<td></td></tr>";
                }
                // bp
                best_html += "<tr>";
                best_html += "<td>best(bp)</td>";
                best_html += "<td>"+best_bp+"</td>";
                best_html += "<td>("+best_bp_rate+"%)</td>";
                best_html += "<td>"+best_bp_opt+"</td></tr>";
                document.querySelector('#best tbody').innerHTML = best_html;
                document.querySelector('#result tbody').innerHTML = out;
                updateSp12Display();
        }

        window.addEventListener('DOMContentLoaded', function() {
            connectWebSocket();
        });

        window.addEventListener('beforeunload', function() {
            if (ws) {
                ws.close();
            }
        });

</script>
</head>

    <table id="title">
      <tbody>
      </tbody>
    </table>
    <table id="best">
      <tbody>
      </tbody>

</body>
</html>
